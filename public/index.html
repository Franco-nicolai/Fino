:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --canvas: #f5f7ff;
  --sidebar: #ffffff;
  --paper: #ffffff;
  --ink: #142041;
  --muted: #4d5c7e;
  --faint: #5d6d91;
  --line: #dce3f5;
  --soft-line: #e8edf8;
  --accent: #214cd6;
  --accent-hover: #153ab2;
  --accent-light: #ebf0ff;
  --blue: #3160f8;
  --warning: #945018;
  --danger: #a32a4c;
  background: var(--canvas);
  color: var(--ink);
  font-synthesis: none;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, input, select { font: inherit; }
button, a, input, select, summary { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .42; }
a { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid #315df1;
  outline-offset: 3px;
}
main:focus { outline: none; }
[hidden] { display: none !important; }
p, h1, h2, h3 { margin: 0; }
svg { flex: none; vertical-align: middle; }
.numeric, table td { font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.capitalize { text-transform: capitalize; }

.skip {
  position: fixed;
  z-index: 5;
  top: 12px;
  left: 12px;
  padding: 12px 16px;
  border-radius: 6px;
  transform: translateY(-150%);
  background: var(--accent);
  color: white;
}
.skip:focus { transform: translateY(0); }

.workspace { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100dvh; }
.sidebar {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: sticky;
  top: 0;
  padding: 27px 16px 18px;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  z-index: 2;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  width: max-content;
  padding: 2px 6px;
  text-decoration: none;
}
.brand strong { font-size: 24px; line-height: 1; letter-spacing: -.055em; display: block; }
.brand small { color: var(--muted); font-size: 11px; display: block; margin-top: 5px; }
.nav-caption { font-size: 10px; font-weight: 750; letter-spacing: .11em; color: var(--faint); margin: 37px 0 10px 11px; }
.side-nav { display: grid; gap: 4px; }
.side-nav button, .settings-link {
  display: flex;
  gap: 11px;
  align-items: center;
  width: 100%;
  min-height: 44px;
  padding: 8px 11px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 550;
  text-align: left;
}
.side-nav button:hover, .settings-link:hover { background: #f2f5ff; color: var(--ink); }
.side-nav button[aria-current] {
  color: var(--accent);
  background: #eaf0ff;
  border-color: #e2eaff;
  font-weight: 680;
}
.sidebar-foot { margin-top: auto; }
.workspace-status {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 17px 4px 0;
  border-top: 1px solid var(--line);
  margin-top: 12px;
  font-size: 11px;
  color: var(--muted);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #a1661e; flex: none; }
.status-dot.personal { background: #315df1; }
.currency { margin-left: auto; font-size: 10px; letter-spacing: .07em; color: var(--faint); }

.main-shell { min-width: 0; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  min-height: 67px;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 10px clamp(22px, 4vw, 60px);
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}
.breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.breadcrumb strong { color: var(--ink); font-weight: 650; }
.topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.button, .period-control button, .icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 10px;
  min-height: 40px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 610;
  text-decoration: none;
}
.button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.button.primary:hover { background: var(--accent-hover); }
.button.secondary { background: var(--paper); border-color: var(--line); }
.button.secondary:hover, .icon-button:hover, .button.quiet:hover { background: var(--accent-light); }
.button.quiet { color: var(--accent); }
.button.small { padding: 6px 9px; min-height: 34px; font-size: 12px; }
.button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
.button.danger:hover { background: #72212a; }
.period-control { display: inline-flex; align-items: center; padding: 0 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.period-control button { padding: 5px 7px; min-height: 38px; font-size: 12px; }
.period-control button:not(:disabled):hover { background: var(--accent-light); }
.period-control .period-label { min-width: 133px; gap: 7px; text-transform: capitalize; white-space: nowrap; }
.icon-button { width: 36px; min-height: 36px; padding: 5px; border: 1px solid var(--line); }

.content { max-width: 1370px; margin: 0 auto; padding: 0 clamp(22px, 4vw, 60px) 62px; }
.loading { padding: 36px; color: var(--muted); }
.tabs, .sub-tabs { display: flex; align-items: stretch; gap: 23px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tabs button, .sub-tabs button {
  flex: none;
  padding: 14px 1px;
  min-height: 53px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 550;
}
.tabs button:hover, .sub-tabs button:hover { color: var(--ink); }
.tabs button[aria-current], .sub-tabs button[aria-current] { color: var(--accent); border-color: var(--accent); font-weight: 680; }
.sub-tabs { gap: 19px; }
.sub-tabs button { min-height: 42px; font-size: 12px; padding: 9px 1px; }
.view-heading { padding: 33px 0 22px; }
.eyebrow { color: var(--blue); font-size: 10px; font-weight: 730; letter-spacing: .16em; margin-bottom: 9px; }
.view-heading h1 {
  font-size: clamp(29px, 3.35vw, 48px);
  line-height: 1.05;
  font-weight: 650;
  letter-spacing: -.058em;
  overflow-wrap: anywhere;
}
.view-heading > p:not(.eyebrow) { color: var(--muted); font-size: 14px; margin-top: 12px; line-height: 1.55; }

.balance-hero {
  display: grid;
  grid-template-columns: minmax(0, .86fr) minmax(0, 1.5fr);
  gap: clamp(18px, 4vw, 55px);
  padding: clamp(21px, 3.15vw, 43px);
  border-radius: 24px;
  color: #fff;
  background: radial-gradient(ellipse at 103% 108%, #4e7afb 0, transparent 61%), linear-gradient(111deg, #1439c8, #315df3 73%);
  overflow: hidden;
}
.hero-summary { align-self: center; min-width: 0; }
.hero-kicker { color: #e2ebff; font-size: 11px; font-weight: 730; letter-spacing: .11em; }
.hero-balance { display: block; font-size: clamp(29px, 4.1vw, 60px); letter-spacing: -.059em; line-height: 1.08; font-weight: 690; margin: 9px 0 5px; white-space: normal; overflow-wrap: anywhere; }
.hero-date { color: #e2ebff; font-size: 12px; }
.hero-delta { margin-top: 14px; font-size: 12px; font-weight: 650; color: #fff; }
.hero-link { display: inline-flex; gap: 6px; align-items: center; background: #ffffff20; color: white; border: 1px solid #ffffff48; border-radius: 9px; padding: 8px 11px; margin-top: 15px; font-size: 12px; font-weight: 650; }
.hero-link:hover { background: #ffffff35; }
.hero-link:focus-visible, .range-switch button:focus-visible { outline-color: white; }
.hero-visual { min-width: 0; align-self: center; }
.hero-chart-heading { display: flex; align-items: center; justify-content: space-between; gap: 9px; color: #fff; font-size: 13px; font-weight: 620; margin-bottom: 11px; }
.range-switch { display: flex; align-items: center; gap: 3px; background: #1134ad6e; border-radius: 9px; padding: 3px; }
.range-switch button { font-size: 11px; font-weight: 680; color: #fff; padding: 6px 8px; border: 0; border-radius: 7px; background: transparent; }
.range-switch button:hover { background: #ffffff32; }
.range-switch button[aria-pressed=true] { background: #fff; color: #1a43ca; }
.history-chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart-grid { stroke: #ffffff38; stroke-width: 1; stroke-dasharray: 4 4; }
.chart-label { fill: #e9f0ff; font-size: 11px; }
.history-line { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.history-point { cursor: pointer; }
.point-dot { fill: white; stroke: #315cf0; stroke-width: 1.3; }
.point-halo { fill: #b8d6ff; opacity: 0; }
.history-point[aria-pressed=true] .point-halo, .history-point:hover .point-halo, .history-point:focus-visible .point-halo { opacity: .72; }
.history-point:focus-visible { outline: none; }
.history-point:focus-visible .point-halo { stroke: white; stroke-width: 2; }
.balance-hero .empty, .balance-hero .empty strong { color: #f2f6ff; }

.metrics-strip, .report-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0 0;
}
.report-metrics { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin: 0 0 16px; }
.metric {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  text-align: left;
  padding: 16px clamp(10px, 1.6vw, 21px);
  min-height: 100px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper);
  min-width: 0;
}
button.metric:hover { background: #f9fbff; border-color: #aabcf6; }
.metric.metric-primary { background: var(--accent-light); color: var(--accent); }
button.metric.metric-primary:hover { background: #e0e9ff; }
.metric-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; color: var(--muted); }
.metric-value { margin: 7px 0 5px; font-size: clamp(19px, 2.3vw, 33px); font-weight: 675; line-height: 1.14; letter-spacing: -.05em; white-space: normal; overflow-wrap: anywhere; }
.metric small { font-size: 11px; line-height: 1.4; color: var(--muted); }
.analysis-grid { display: grid; grid-template-columns: minmax(0, 1.24fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.analysis-panel { min-width: 0; padding: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; }
.block-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.block-heading h2, .statement-heading h2 { font-size: 17px; font-weight: 680; letter-spacing: -.026em; }
.block-heading p { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.chart-tag { background: var(--accent-light); color: var(--accent); border-radius: 100px; padding: 5px 10px; font-size: 11px; font-weight: 660; white-space: nowrap; }
.bar-track { height: 6px; overflow: hidden; background: #edf0f9; border-radius: 12px; }
.bar-track > div { height: 100%; background: #4168f3; border-radius: inherit; }
.text-link { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; background: transparent; color: var(--accent); font-weight: 650; text-align: left; overflow-wrap: anywhere; }
.text-link:hover { text-decoration: underline; text-underline-offset: .2em; }
.detail-section { padding: 23px 0 0; }
.detail-section .block-heading { margin-bottom: 9px; }

.trend { --plot-height: 128px; }
.trend-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 9px; color: var(--muted); font-size: 11px; }
.trend-legend span, .flow-totals span, .composition-legend span { display: flex; align-items: center; gap: 6px; }
.trend-legend i, .flow-totals i, .composition-legend i { display: inline-block; width: 8px; height: 8px; flex: none; border-radius: 50%; }
.legend-income { background: #315df5; }
.legend-expense { background: #7857dc; }
.legend-result { background: #117f87; }
.legend-deficit { background: #b76e33; }
.trend-bars { display: grid; grid-template-columns: repeat(var(--months), minmax(0, 1fr)); gap: 3px; }
.trend-month { display: grid; gap: 7px; padding: 6px 2px; background: none; border: 0; border-radius: 8px; min-width: 0; }
.trend-month:hover, .trend-month[aria-pressed=true] { background: var(--accent-light); }
.bar-pair { height: var(--plot-height); position: relative; display: block; width: 100%; }
.bar-pair::before { content: ""; position: absolute; inset: var(--baseline) 0 auto; border-top: 1px solid #dce3f5; }
.trend-bar { position: absolute; bottom: var(--bar-start); height: var(--bar-height); width: min(24%, 24px); border-radius: 4px 4px 2px 2px; }
.bar-income { background: #3d63f4; right: calc(50% + 2px); }
.bar-expense { background: #a489f6; left: calc(50% + 2px); }
.trend-month-label { text-transform: capitalize; color: var(--muted); font-size: 11px; }
.trend-month[aria-pressed=true] .trend-month-label { color: var(--accent); font-weight: 720; }
.spending-changes { display: grid; }
.change-row { display: grid; grid-template-columns: 33px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--soft-line); font-size: 13px; }
.change-row small { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
.change-icon { display: grid; place-items: center; width: 32px; height: 32px; background: #edf4ff; color: #315df1; border-radius: 9px; }
.change-up { color: #6743c9; background: #f1ebff; }
.inline-insight { font-size: 12px; line-height: 1.45; color: var(--muted); padding-top: 13px; }
.inline-insight strong { color: var(--ink); }
.flow-card .block-heading h2 { font-size: clamp(19px, 2.2vw, 28px); }
.flow-totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
.flow-totals > div { background: #f4f6ff; padding: 12px clamp(7px, 1.7vw, 17px); border-radius: 12px; }
.flow-totals span { color: var(--muted); font-size: 11px; font-weight: 650; line-height: 1.3; }
.flow-totals strong { display: block; font-size: clamp(16px, 2.3vw, 28px); letter-spacing: -.04em; margin-top: 5px; white-space: normal; overflow-wrap: anywhere; }
.flow-columns, .sankey-canvas { display: grid; grid-template-columns: minmax(125px, .75fr) minmax(0, 2.65fr) minmax(125px, .84fr); }
.flow-columns { font-size: 11px; color: var(--muted); font-weight: 700; padding: 6px 0; border-bottom: 1px solid var(--soft-line); }
.flow-columns > :nth-child(2) { text-align: center; }
.flow-columns > :last-child { padding-left: 9px; }
.sankey-chart { width: 100%; height: var(--flow-height); min-width: 0; }

function localDate(date = new Date()) {

  const assets = rowsFor(state, balances, 'asset');
  const liabilities = rowsFor(state, balances, 'liability');
  const equity = rowsFor(state, balances, 'equity');
  const assetTotal = total(assets);
  const liabilityTotal = total(liabilities);
  const accumulated = total(rowsFor(state, balances, 'income'))
    - total(rowsFor(state, balances, 'expense'));
  return {
    assets, liabilities, equity, assetTotal, liabilityTotal, accumulated, balances,
    netWorth: assetTotal - liabilityTotal,
    cash: total(assets.filter(row => row.account.profile === 'cash')),
  };
}

function worthHistory(state, month, today, length = 6) {
  return Array.from({ length }, (_, index) => {
    const period = shiftMonth(month, index - length + 1);
    const { end } = periodFor(period, today);
    const hasData = state.entries.some(entry => entry.status === 'posted' && entry.date <= end);
    return { month: period, amount: hasData ? positionFor(state, end).netWorth : null };
  });
}

function cashFlowFor(state, { start, end }) {
  const cashIds = new Set(state.accounts
    .filter(account => account.kind === 'asset' && account.profile === 'cash')
    .map(account => account.id));
  const netCash = entry => entry.lines.reduce((sum, line) => cashIds.has(line.account)
    ? sum + line.debit - line.credit : sum, 0);
  let prior = 0;
  let opening = 0;
  const flows = { operating: 0, investing: 0, financing: 0 };
  const details = { operating: [], investing: [], financing: [] };
  for (const entry of currentEntries(state, null, end)) {
    const amount = netCash(entry);
    if (entry.date < start) {
      prior += amount;
    } else if (entry.cashClass === 'opening') {
      opening += amount;
    } else if (amount) {
      flows[entry.cashClass] += amount;
      details[entry.cashClass].push({ entry, amount });
    }
  }
  const initial = prior + opening;
  const change = Object.values(flows).reduce((sum, amount) => sum + amount, 0);
  const ending = positionFor(state, end).cash;
  return { prior, opening, initial, flows, change, ending, details, difference: ending - initial - change };
}

function entryLines(debit, credit, amount) {
  return [{ account: debit, debit: amount, credit: 0 }, { account: credit, debit: 0, credit: amount }];
}

function nextId() {
  if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint32Array(4)),
    part => part.toString(16).padStart(8, '0')).join('');
}

function makeMovement(state, values, status, id = nextId()) {
  const { type, from, to, date } = values;
  const description = values.description.trim();
  const amount = values.amount;
  const accounts = accountIndex(state);
  const source = accounts.get(from);
  const target = accounts.get(to);
  assert(['income', 'expense', 'transfer'].includes(type), 'Selecciona un tipo de movimiento.');
  assert(isDate(date), 'Ingresa una fecha válida.');
  assert(shortText(description, 120), 'Ingresa un concepto de hasta 120 caracteres.');
  assert(integer(amount, 1, MAX_AMOUNT), 'Ingresa un monto entero en CLP mayor a cero.');
  assert(source?.active && target?.active && from !== to, 'Selecciona dos cuentas activas distintas.');
  const balanceAccount = account => ['asset', 'liability'].includes(account.kind);
  if (type === 'income') {
    assert(source.kind === 'income' && target.kind === 'asset',
      'Selecciona una categoría de ingreso y una cuenta de activo.');
  } else if (type === 'expense') {
    assert(balanceAccount(source) && target.kind === 'expense',
      'Selecciona una cuenta de pago y una categoría de gasto.');
  } else {
    assert(balanceAccount(source) && balanceAccount(target),
      'Selecciona dos cuentas de activo o pasivo.');
  }
  let cashClass = 'operating';
  if (type === 'transfer') {
    if (Object.hasOwn(CASH_CLASSES, values.cashClass)) {
      cashClass = values.cashClass;
    } else if ([source, target].some(account => account.kind === 'liability')) {
      cashClass = 'financing';
    } else if ([source, target].some(account => account.profile !== 'cash')) {
      cashClass = 'investing';
    }
  }
  const goal = values.goal || undefined;
  assert(!goal || (type === 'expense' && state.goals.some(item => item.id === goal)),
    'Selecciona un proyecto válido para el gasto.');
  return { id, type, status, date, description, lines: entryLines(to, from, amount), cashClass,
    ...(goal ? { goal } : {}) };
}

function recordMovement(state, values, status, id) {
  assert(status === 'posted' || status === 'draft', 'El estado del movimiento no es válido.');
  const draftIndex = id ? state.entries.findIndex(entry => entry.id === id) : -1;
  if (id) assert(state.entries[draftIndex]?.status === 'draft', 'El borrador ya cambió.');
  const entry = makeMovement(state, values, status, id);
  if (draftIndex >= 0) {
    state.entries[draftIndex] = entry;
  } else {
    assert(state.entries.length < MAX_ENTRIES, 'Alcanzaste el límite de movimientos de este espacio.');
    state.entries.push(entry);
  }
  return entry;
}

function deleteDraft(state, id) {
  const index = state.entries.findIndex(entry => entry.id === id && entry.status === 'draft');
  assert(index >= 0, 'El borrador ya cambió.');
  state.entries.splice(index, 1);
}

function reverseMovement(state, id, date) {
  const original = state.entries.find(entry => entry.id === id && entry.status === 'posted');
  assert(original && original.type !== 'reversal', 'Este movimiento no se puede revertir.');
  assert(!state.entries.some(entry => entry.reverses === id), 'El movimiento ya fue revertido.');
  assert(isDate(date) && date >= original.date, 'La fecha debe ser igual o posterior al movimiento original.');
  assert(state.entries.length < MAX_ENTRIES, 'Alcanzaste el límite de movimientos de este espacio.');
  const entry = {
    id: nextId(), type: 'reversal', status: 'posted', date,
    description: ('Reversión de ' + original.description).slice(0, 120),
    cashClass: original.cashClass,
    reverses: original.id,
    ...(original.goal ? { goal: original.goal } : {}),
    lines: original.lines.map(line => ({ account: line.account, debit: line.credit, credit: line.debit })),
  };
  state.entries.push(entry);
  return entry;
}

function hasHistory(state, id) {
  return state.entries.some(entry => entry.status === 'posted' && entry.lines.some(line => line.account === id));
}

function canDeleteAccount(state, id) {
  return id !== OPENING_EQUITY
    && !state.entries.some(entry => entry.lines.some(line => line.account === id))
    && !state.budgets.some(budget => budget.account === id)
    && !(state.statements ?? []).some(statement => statement.account === id)
    && !state.accounts.some(account => account.paymentAccount === id)
    && !state.goals.some(goal => goal.allocations.some(allocation => allocation.account === id));
}

function upsertAccount(state, input, id) {
  const existing = id && state.accounts.find(account => account.id === id);
  if (id) assert(existing && id !== OPENING_EQUITY, 'La cuenta ya cambió o está protegida.');
  const name = input.name.trim();
  const { kind, profile } = input;
  assert(shortText(name, 70) && Object.hasOwn(CLASSES, kind), 'Ingresa un nombre y tipo válidos.');
  assert(!state.accounts.some(account => account.id !== id
    && account.name.toLocaleLowerCase('es-CL') === name.toLocaleLowerCase('es-CL')),
  'Ya existe una cuenta con ese nombre.');
  assert(PROFILES[kind] ? Object.hasOwn(PROFILES[kind], profile) : profile === '', 'Selecciona una clasificación válida.');
  if (id && !canDeleteAccount(state, id)) {
    assert(existing.kind === kind, 'Una cuenta vinculada conserva su tipo contable.');
  }
  if (existing && (state.statements ?? []).some(item => item.account === id)) {
    assert(['card', 'line'].includes(profile), 'Una cuenta con estados de tarjeta debe conservar su clasificación de crédito.');
  }
  if (existing?.kind === 'asset' && (existing.profile === 'cash') !== (profile === 'cash')) {
    assert(!hasHistory(state, id), 'La clasificación de efectivo de una cuenta con historial se conserva.');
    assert(!state.accounts.some(account => account.paymentAccount === id),
      'Desvincula esta cuenta de las tarjetas antes de cambiar su clasificación.');
  }
  const opening = input.opening ?? 0;
  if (!existing) {
    assert(state.accounts.length < ACCOUNT_LIMIT, 'Alcanzaste el límite de cuentas.');
    assert(integer(opening, 0, MAX_AMOUNT), 'Ingresa un saldo inicial entero y válido.');
    if (opening) {
      assert(['asset', 'liability'].includes(kind) && isDate(input.openingDate),        'El saldo inicial requiere una cuenta de activo o pasivo y una fecha.');
      assert(state.entries.length < MAX_ENTRIES, 'Alcanzaste el límite de movimientos.');
    }
  }
  const account = { id: id || nextId(), name, kind, profile, active: existing?.active ?? true };
  if (kind === 'asset' && profile !== 'cash' && input.estimate !== null && input.estimate !== undefined) {
    assert(integer(input.estimate, 0, MAX_AMOUNT) && isDate(input.valuationDate),
      'La valoración requiere un monto entero y una fecha válida.');
    account.estimate = input.estimate;
    account.valuationDate = input.valuationDate;
  }
  if (kind === 'liability' && profile !== 'unclassified') {
    const institution = input.institution?.trim();
    if (institution) account.institution = institution.slice(0, 70);
    if (['card', 'line'].includes(profile) && input.paymentAccount) {
      assert(state.accounts.some(item => item.id === input.paymentAccount && item.kind === 'asset' && item.profile === 'cash'),
        'Selecciona una cuenta de efectivo para pagar la tarjeta.');
      account.paymentAccount = input.paymentAccount;
    }
    for (const [key, upper] of [['limit', MAX_AMOUNT], ['minimum', MAX_AMOUNT], ['monthlyPayment', MAX_AMOUNT], ['monthlyFee', MAX_AMOUNT], ['annualRateBps', 10000], ['closingDay', 31], ['dueDay', 31]]) {
      if (input[key] !== null && input[key] !== undefined) {
        assert(integer(input[key], ['monthlyFee', 'annualRateBps'].includes(key) ? 0 : 1, upper), 'Revisa los datos contractuales de la cuenta.');
        account[key] = input[key];
      }
    }
  }
  if (existing) {
    state.accounts[state.accounts.indexOf(existing)] = account;
  } else {
    state.accounts.push(account);
    if (opening) {
      const lines = kind === 'asset'
        ? entryLines(account.id, OPENING_EQUITY, opening)
        : entryLines(OPENING_EQUITY, account.id, opening);
      state.entries.push({
        id: nextId(), type: 'opening', status: 'posted', date: input.openingDate,
        description: ('Saldo inicial de ' + name).slice(0, 120), lines, cashClass: 'opening',
      });
    }
  }
  return account;
}

function changeAccountStatus(state, id, active) {
  const account = state.accounts.find(item => item.id === id && item.id !== OPENING_EQUITY);
  assert(account, 'La cuenta ya cambió o está protegida.');
  account.active = active;
}

function deleteAccount(state, id) {
  const index = state.accounts.findIndex(account => account.id === id);
  assert(index >= 0 && canDeleteAccount(state, id), 'La cuenta tiene movimientos o dependencias.');
  state.accounts.splice(index, 1);
}

function upsertBudget(state, month, account, planned) {
  const category = state.accounts.find(item => item.id === account && ['income', 'expense'].includes(item.kind));
  assert(category && isDate(month + '-01') && integer(planned, 0, MAX_AMOUNT), 'Revisa el período, la categoría y el monto.');
  const existing = state.budgets.find(budget => budget.month === month && budget.account === account);
  if (existing) existing.planned = planned;
  else {
    assert(state.budgets.length < MAX_ENTRIES, 'Alcanzaste el límite de presupuestos.');
    state.budgets.push({ month, account, planned });
  }
}

function upsertGoal(state, name, target, id) {
  name = name.trim();
  assert(shortText(name, 70) && integer(target, 1, MAX_AMOUNT), 'Ingresa un nombre y una meta en CLP.');
  const existing = id && state.goals.find(goal => goal.id === id);
  if (id) assert(existing, 'El objetivo ya cambió.');
  if (existing) {
    existing.name = name;
    existing.target = target;
    return existing;
  }
  assert(state.goals.length < ACCOUNT_LIMIT, 'Alcanzaste el límite de objetivos.');
  const goal = { id: nextId(), name, target, allocations: [] };
  state.goals.push(goal);
  return goal;
}

function cardStatement(state, accountId, cutoff = today) {
  return (state.statements ?? []).filter(item => item.account === accountId && item.issueDate <= cutoff)
    .sort((a, b) => b.issueDate.localeCompare(a.issueDate))[0];
}

function statementPayments(state, statement, cutoff = today) {
  const next = (state.statements ?? []).filter(item => item.account === statement.account
    && item.issueDate > statement.issueDate).sort((a, b) => a.issueDate.localeCompare(b.issueDate))[0];
  const accounts = accountIndex(state);
  const paysCard = entry => entry.type === 'transfer'
    && entry.lines.some(line => line.account === statement.account && line.debit > 0)
    && entry.lines.some(line => line.credit > 0 && accounts.get(line.account)?.kind === 'asset');
  return state.entries.filter(entry => entry.status === 'posted' && entry.date >= statement.issueDate
    && entry.date <= cutoff && (!next || entry.date < next.issueDate)
    && paysCard(entry))
    .reduce((sum, entry) => {
      const line = entry.lines.find(line => line.account === statement.account);
      const reversed = state.entries.some(item => item.reverses === entry.id
        && item.status === 'posted' && item.date <= cutoff);
      return sum + (reversed ? 0 : line.debit);
    }, 0);
}

function upsertStatement(state, input) {
  const account = state.accounts.find(item => item.id === input.account
    && item.kind === 'liability' && ['card', 'line'].includes(item.profile));
  assert(account, 'Selecciona una tarjeta o línea de crédito válida.');
  assert(isDate(input.issueDate) && input.issueDate <= today && isDate(input.dueDate) && input.dueDate >= input.issueDate,
    'Revisa la fecha de emisión y vencimiento del estado de cuenta.');
  for (const key of ['billed', 'minimum', 'interest', 'fees'])
    assert(integer(input[key], 0, MAX_AMOUNT), 'Ingresa importes enteros no negativos.');
  assert(input.minimum <= input.billed, 'El pago mínimo no puede superar el total facturado.');
  const existing = (state.statements ?? []).find(item => item.account === account.id
    && item.issueDate === input.issueDate);
  if (!state.statements) state.statements = [];
  if (!existing) assert(state.statements.length < MAX_ENTRIES, 'Alcanzaste el límite de estados de cuenta.');
  const statement = { account: account.id, issueDate: input.issueDate, dueDate: input.dueDate,
    billed: input.billed, minimum: input.minimum, interest: input.interest, fees: input.fees };
  if (existing) state.statements[state.statements.indexOf(existing)] = statement;
  else state.statements.push(statement);
  return statement;
}

function cashEffect(entry, account) {
  const line = entry.lines.find(line => line.account === account);
  return line ? line.debit - line.credit : 0;
}

function saveReconciliation(state, account, date, balance, entries) {
  assert(state.accounts.some(item => item.id === account && item.kind === 'asset' && item.profile === 'cash'), 'Selecciona una cuenta de efectivo.');
  assert(isDate(date) && date <= today && integer(balance, -MAX_AMOUNT, MAX_AMOUNT), 'Revisa la fecha y el saldo del extracto.');
  const eligible = state.entries.filter(item => item.status === 'posted' && item.date <= date && cashEffect(item, account));
  const ids = new Set(entries);
  assert(ids.size === entries.length, 'Hay movimientos duplicados en la selección.');
  assert([...ids].every(id => eligible.some(item => item.id === id)), 'Hay movimientos fuera del corte.');
  const sum = eligible.reduce((total, item) => total + (ids.has(item.id) ? cashEffect(item, account) : 0), 0);
  assert(sum === balance, 'La selección difiere del saldo del extracto en ' + money(balance - sum) + '.');
  state.reconciliations ??= [];
  const index = state.reconciliations.findIndex(item => item.account === account && item.date === date);
  const record = { account, date, balance, entries: [...ids] };
  if (index >= 0) state.reconciliations[index] = record;
  else state.reconciliations.push(record);
  return record;
}

function saveCashPlan(state, input) {
  assert(shortText(input.label, 100) && isDate(input.date) && input.date > today && ['in', 'out'].includes(input.direction)
    && integer(input.amount, 1, MAX_AMOUNT), 'Completa fecha, concepto y monto de la proyección.');
  state.cashPlans ??= [];
  assert(state.cashPlans.length < MAX_ENTRIES, 'Alcanzaste el límite de compromisos.');
  state.cashPlans.push({ id: nextId(), ...input });
}

function projectedCash(state, start, days = 60) {
  const end = localDate(new Date(parseDate(start).getTime() + days * 86400000));
  const cash = positionFor(state, start).cash;
  const events = (state.cashPlans ?? []).filter(item => item.date > start && item.date <= end)
    .map(item => ({ date: item.date, label: item.label, amount: item.amount * (item.direction === 'in' ? 1 : -1), source: 'manual', id: item.id }));
  const balances = positionFor(state, start).balances;
  for (const account of state.accounts.filter(item => item.kind === 'liability' && item.active)) {
    const debt = Math.max(0, balances.get(account.id) ?? 0);
    if (!debt) continue;
    const statement = cardStatement(state, account.id, start);
    if (statement && statement.dueDate > start && statement.dueDate <= end) {
      const pending = Math.min(debt, Math.max(0, statement.billed - statementPayments(state, statement, start)));
      if (pending) events.push({ date: statement.dueDate, label: 'Estado · ' + account.name, amount: -pending, source: 'statement' });
      continue;
    }
    if (!account.dueDay || !account.monthlyPayment && !account.minimum) continue;
    for (let month = start.slice(0, 7), i = 0; i < 4; i++, month = shiftMonth(month, 1)) {
      const date = month + '-' + String(Math.min(account.dueDay, Number(monthEnd(month).slice(8)))).padStart(2, '0');
      if (date > start && date <= end) events.push({ date, label: 'Cuota estimada · ' + account.name,
        amount: -Math.min(debt, account.monthlyPayment ?? account.minimum), source: 'estimated' });
    }
  }
  events.sort((a,b) => a.date.localeCompare(b.date) || a.label.localeCompare(b.label));
  let running = cash;
  return { start: cash, end, events: events.map(item => ({ ...item, balance: running += item.amount })) };
}

function loanScenario(payment, annualRate, months) {
  if (!payment || !months) return { principal: 0, total: 0, interest: 0 };
  const rate = annualRate / 1200;
  const principal = rate ? payment * (1 - Math.pow(1 + rate, -months)) / rate : payment * months;
  return { principal: Math.floor(principal), total: payment * months, interest: Math.ceil(payment * months - principal) };
}

function reservedIn(state, account, excludeGoal) {
  return state.goals.filter(goal => goal.id !== excludeGoal)
    .reduce((sum, goal) => sum + goalReservation(state, goal, account), 0);
}

function goalSpending(state, goalId, cutoff = null) {
  return state.entries.filter(entry => entry.status === 'posted' && entry.goal === goalId
    && (!cutoff || entry.date <= cutoff))
    .reduce((sum, entry) => sum + (entry.type === 'expense' ? 1 : entry.type === 'reversal' ? -1 : 0)
      * entry.lines.reduce((amount, line) => amount + line.debit, 0), 0);
}

function goalReservation(state, goal, account, cutoff = null) {
  const allocation = goal.allocations.find(item => item.account === account)?.amount ?? 0;
  const preceding = goal.allocations.slice(0, goal.allocations.findIndex(item => item.account === account))
    .reduce((sum, item) => sum + item.amount, 0);
  return Math.max(0, allocation - Math.max(0, goalSpending(state, goal.id, cutoff) - preceding));
}

function setAllocation(state, goalId, accountId, amount, cutoff) {
  const goal = state.goals.find(item => item.id === goalId);
  const account = state.accounts.find(item => item.id === accountId && item.kind === 'asset');
  assert(goal && account && integer(amount, 0, MAX_AMOUNT), 'Revisa el objetivo, la cuenta y el monto.');
  const index = goal.allocations.findIndex(item => item.account === accountId);
  if (index >= 0) goal.allocations.splice(index, 1);
  if (amount) goal.allocations.push({ account: accountId, amount });
  for (const item of goal.allocations) {
    const funding = state.accounts.find(account => account.id === item.account);
    const balance = positionFor(state, cutoff).balances.get(item.account) ?? 0;
    assert(funding?.active && goalReservation(state, goal, item.account, cutoff)
      + reservedIn(state, item.account, goal.id) <= balance,
      'La cuenta tiene saldo disponible insuficiente para esta asignación.');
  }
}

function estimatedPosition(position, cutoff) {
  const relevant = position.assets.filter(row => row.account.profile !== 'cash');
  const valued = relevant.filter(({ account }) => account.estimate !== undefined && account.valuationDate <= cutoff);
  const adjustment = valued.reduce((sum, { account, amount }) => sum + account.estimate - amount, 0);
  return { valued, relevant, assets: position.assetTotal + adjustment, worth: position.netWorth + adjustment };
}

function validateBackup(backup) {
  const invalid = 'El archivo no es un respaldo válido de Fino.';
  assert(backup?.format === 'fino-web' && backup.version === 1, invalid);
  const state = backup.state;
  assert(state && ['accounts', 'entries', 'budgets', 'goals'].every(key => Array.isArray(state[key])), invalid);
  assert(state.accounts.length <= ACCOUNT_LIMIT && state.entries.length <= MAX_ENTRIES
    && state.budgets.length <= MAX_ENTRIES && state.goals.length <= ACCOUNT_LIMIT
    && (state.statements === undefined || (Array.isArray(state.statements) && state.statements.length <= MAX_ENTRIES))
    && (state.reconciliations === undefined || Array.isArray(state.reconciliations))
    && (state.cashPlans === undefined || Array.isArray(state.cashPlans)), invalid);
  const accounts = accountIndex(state);
  assert(accounts.size === state.accounts.length && accounts.get(OPENING_EQUITY)?.kind === 'equity'
    && accounts.get(OPENING_EQUITY)?.active === true, invalid);
  const names = new Set();
  for (const account of state.accounts) {
    assert(shortText(account.id, 80) && shortText(account.name, 70) && Object.hasOwn(CLASSES, account.kind)
      && typeof account.active === 'boolean', invalid);
    const name = account.name.trim().toLocaleLowerCase('es-CL');
    assert(!names.has(name), invalid);
    names.add(name);
    assert(PROFILES[account.kind] ? Object.hasOwn(PROFILES[account.kind], account.profile) : account.profile === '', invalid);
    assert(account.estimate === undefined || (account.kind === 'asset' && account.profile !== 'cash'
      && integer(account.estimate, 0, MAX_AMOUNT) && isDate(account.valuationDate)), invalid);
    assert(account.institution === undefined || shortText(account.institution, 70), invalid);
    assert(account.paymentAccount === undefined || (account.kind === 'liability'
      && ['card', 'line'].includes(account.profile) && accounts.get(account.paymentAccount)?.kind === 'asset'
      && accounts.get(account.paymentAccount)?.profile === 'cash'), invalid);
    for (const [key, upper] of [['limit', MAX_AMOUNT], ['minimum', MAX_AMOUNT], ['monthlyPayment', MAX_AMOUNT], ['monthlyFee', MAX_AMOUNT], ['annualRateBps', 10000], ['closingDay', 31], ['dueDay', 31]]) {
      assert(account[key] === undefined || integer(account[key], ['monthlyFee', 'annualRateBps'].includes(key) ? 0 : 1, upper), invalid);
    }
  }
  const journal = new Map();
  const reversed = new Set();
  for (const entry of state.entries) {
    assert(entry && shortText(entry.id, 80) && !journal.has(entry.id) && shortText(entry.description, 120)
      && isDate(entry.date) && Object.hasOwn(MOVEMENTS, entry.type)
      && ['posted', 'draft'].includes(entry.status) && Array.isArray(entry.lines)
      && entry.lines.length === 2, invalid);
    const [debit, credit] = entry.lines;
    if (entry.type === 'reversal') {
      const original = journal.get(entry.reverses);
      assert(entry.status === 'posted' && original?.status === 'posted' && original.type !== 'reversal'
        && !reversed.has(original.id) && entry.date >= original.date && entry.cashClass === original.cashClass
        && entry.goal === original.goal
        && entry.lines.every((line, index) => line?.account === original.lines[index].account
          && line.debit === original.lines[index].credit && line.credit === original.lines[index].debit), invalid);
      reversed.add(original.id);
    } else {
      assert(entry.reverses === undefined && debit && credit && accounts.has(debit.account) && accounts.has(credit.account)
        && debit.account !== credit.account && integer(debit.debit, 1, MAX_AMOUNT)
        && debit.credit === 0 && credit.debit === 0 && credit.credit === debit.debit, invalid);
      const debitKind = accounts.get(debit.account).kind;
      const creditKind = accounts.get(credit.account).kind;
      const balanceClass = kind => ['asset', 'liability'].includes(kind);
      if (entry.type === 'opening') {
        assert(entry.status === 'posted' && entry.cashClass === 'opening'
          && ((debitKind === 'asset' && credit.account === OPENING_EQUITY)
          || (creditKind === 'liability' && debit.account === OPENING_EQUITY)), invalid);
      } else {
        assert(Object.hasOwn(CASH_CLASSES, entry.cashClass), invalid);
        assert((entry.type === 'income' && debitKind === 'asset' && creditKind === 'income' && entry.cashClass === 'operating')
          || (entry.type === 'expense' && debitKind === 'expense' && balanceClass(creditKind) && entry.cashClass === 'operating')
          || (entry.type === 'transfer' && balanceClass(debitKind) && balanceClass(creditKind)), invalid);
      }
      assert(entry.goal === undefined || (entry.type === 'expense' && shortText(entry.goal, 80)), invalid);
    }
    journal.set(entry.id, entry);
  }
  const budgetKeys = new Set();
  for (const budget of state.budgets) {
    assert(budget && isDate(budget.month + '-01') && integer(budget.planned, 0, MAX_AMOUNT)
      && ['income', 'expense'].includes(accounts.get(budget.account)?.kind), invalid);
    const key = JSON.stringify([budget.month, budget.account]);
    assert(!budgetKeys.has(key), invalid);
    budgetKeys.add(key);
  }
  const goalIds = new Set();
  for (const goal of state.goals) {
    assert(goal && shortText(goal.id, 80) && !goalIds.has(goal.id) && shortText(goal.name, 70)
      && integer(goal.target, 1, MAX_AMOUNT) && Array.isArray(goal.allocations), invalid);
    goalIds.add(goal.id);
    const allocated = new Set();
    for (const item of goal.allocations) {
      assert(item && accounts.get(item.account)?.kind === 'asset' && !allocated.has(item.account)
        && integer(item.amount, 1, MAX_AMOUNT), invalid);
      allocated.add(item.account);
    }
  }
  assert(state.entries.every(entry => entry.goal === undefined || goalIds.has(entry.goal)), invalid);
  const statementKeys = new Set();
  for (const item of state.statements ?? []) {
    const account = accounts.get(item?.account);
    const key = JSON.stringify([item?.account, item?.issueDate]);
    assert(account?.kind === 'liability' && ['card', 'line'].includes(account.profile)
      && isDate(item.issueDate) && isDate(item.dueDate) && item.dueDate >= item.issueDate
      && ['billed', 'minimum', 'interest', 'fees'].every(field => integer(item[field], 0, MAX_AMOUNT))
      && item.minimum <= item.billed && !statementKeys.has(key), invalid);
    statementKeys.add(key);
  }
  const reconciliationKeys = new Set();
  for (const item of state.reconciliations ?? []) {
    const key = JSON.stringify([item?.account, item?.date]);
    assert(accounts.get(item?.account)?.kind === 'asset' && accounts.get(item.account).profile === 'cash'
      && isDate(item.date) && integer(item.balance, -MAX_AMOUNT, MAX_AMOUNT)
      && Array.isArray(item.entries) && item.entries.length <= MAX_ENTRIES
      && item.entries.every(id => journal.get(id)?.status === 'posted'
        && journal.get(id).date <= item.date && journal.get(id).lines.some(line => line.account === item.account))
      && new Set(item.entries).size === item.entries.length && !reconciliationKeys.has(key), invalid);
    reconciliationKeys.add(key);
  }
  const planIds = new Set();
  for (const item of state.cashPlans ?? []) {
    assert(shortText(item?.id, 80) && !planIds.has(item.id) && shortText(item.label, 100)
      && isDate(item.date) && ['in', 'out'].includes(item.direction)
      && integer(item.amount, 1, MAX_AMOUNT), invalid);
    planIds.add(item.id);
  }
  assert((state.reconciliations ?? []).length <= MAX_ENTRIES && (state.cashPlans ?? []).length <= MAX_ENTRIES, invalid);
  return { accounts: state.accounts, entries: state.entries, budgets: state.budgets,
    goals: state.goals, statements: state.statements ?? [], reconciliations: state.reconciliations ?? [],
    cashPlans: state.cashPlans ?? [] };
}

let connection;
function openDatabase() {
  connection ??= new Promise((resolve, reject) => {
    const request = indexedDB.open('fino-web', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('spaces');
    request.onsuccess = () => {
      const database = request.result;
      database.onversionchange = () => {
        database.close();
        connection = undefined;
      };
      resolve(database);
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Cierra las otras pestañas de Fino y vuelve a abrir esta página.'));
  });
  return connection;
}

const updates = typeof BroadcastChannel === 'function' ? new BroadcastChannel('fino-web-changes') : null;

function onSpaceChange(listener) {
  updates?.addEventListener('message', event => listener(event.data));
}

let fallbackStorage = false;
const fallbackKey = space => 'fino-web-space-' + space;

function usesTemporaryStorage() {
  return fallbackStorage;
}

async function accessSpace(space, mutate) {
  if (location.protocol === 'https:' || (location.protocol === 'http:' && location.hostname === '127.0.0.1')) {
    const response = await fetch('/api/spaces/' + space, { cache: 'no-store' });
    if (!response.ok) throw new Error('No se pudo leer el espacio privado. Comprueba tu acceso y la conexión; no se usará almacenamiento temporal.');
    const saved = await response.json();
    const state = saved.state ?? (space === 'demo' ? sampleState() : emptyState());
    const outcome = mutate?.(state);
    if (mutate) {
      const write = await fetch('/api/spaces/' + space, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state, revision: saved.revision }),
      });
      if (write.status === 409) throw new Error('Los datos cambiaron en otra pestaña. Recarga la página antes de guardar.');
      if (!write.ok) throw new Error('No se pudo guardar en el servidor. El cambio no se aplicó.');
      updates?.postMessage(space);
    }
    return { state, outcome };
  }
  let database;
  try {
    database = await openDatabase();
  } catch (error) {
    fallbackStorage = true;
    let stored;
    try { stored = localStorage.getItem(fallbackKey(space)); }
    catch { throw new Error('Este navegador no permite guardar datos locales. Abre Fino con almacenamiento habilitado.'); }
    const state = stored ? JSON.parse(stored) : (space === 'demo' ? sampleState() : emptyState());
    const outcome = mutate?.(state);
    try { localStorage.setItem(fallbackKey(space), JSON.stringify(state)); }
    catch { throw new Error('No se pudo guardar el cambio. Libera espacio y descarga un respaldo.'); }
    if (mutate) updates?.postMessage(space);
    return { state, outcome };
  }
  return new Promise((resolve, reject) => {
    const transaction = database.transaction('spaces', 'readwrite');
    const store = transaction.objectStore('spaces');
    const request = store.get(space);
    let state;
    let outcome;
    let failure;
    request.onsuccess = () => {      try {
        state = request.result ?? (space === 'demo' ? sampleState() : emptyState());
        if (mutate) outcome = mutate(state);
        if (mutate || !request.result) store.put(state, space);
      } catch (error) {
        failure = error;
        transaction.abort();
      }
    };
    transaction.oncomplete = () => {
      if (mutate) updates?.postMessage(space);
      resolve({ state, outcome });
    };
    transaction.onabort = () => reject(failure ?? transaction.error ?? new Error('La operación se interrumpió.'));
    transaction.onerror = () => reject(failure ?? transaction.error);
  });
}


function flowCategory({ account, amount }, side, kind, adjustment) {
  return {
    key: side + ':' + account.id,
    name: account.name,
    account: account.id,
    amount: Math.abs(amount),
    kind,
    adjustment,
  };
}

function groupFlows(items, side) {
  const sorted = items.sort((first, second) => second.amount - first.amount);
  if (sorted.length <= 6) return sorted;
  const members = sorted.slice(5);
  return [...sorted.slice(0, 5), {
    key: 'group:' + side,
    name: 'Otras categorías',
    kind: side === 'in' ? 'income' : 'expense',
    amount: members.reduce((sum, item) => sum + item.amount, 0),
    members,
  }];
}

function ledgerFlow(result) {
  const sources = [];
  const uses = [];
  for (const row of result.income) {
    if (row.amount > 0) sources.push(flowCategory(row, 'in', 'income', false));
    if (row.amount < 0) uses.push(flowCategory(row, 'out', 'income', true));
  }
  for (const row of result.expense) {
    if (row.amount > 0) uses.push(flowCategory(row, 'out', 'expense', false));
    if (row.amount < 0) sources.push(flowCategory(row, 'in', 'expense', true));
  }
  const sourceTotal = sources.reduce((sum, item) => sum + item.amount, 0);
  const useTotal = uses.reduce((sum, item) => sum + item.amount, 0);
  const difference = sourceTotal - useTotal;
  const left = groupFlows(sources, 'in');
  const right = groupFlows(uses, 'out');
  if (difference > 0) right.push({ key: 'surplus', name: 'Excedente', kind: 'balance', amount: difference });
  if (difference < 0) left.push({ key: 'deficit', name: 'Déficit', kind: 'balance', amount: -difference });
  return { left, right, size: Math.max(sourceTotal, useTotal), sourceTotal, useTotal, difference };
}

function flowLayout(flow) {
  const ribbonHeight = 158;
  const spacing = 44;
  const height = Math.max(275, ribbonHeight + spacing * Math.max(flow.left.length, flow.right.length));
  const start = (height - ribbonHeight) / 2;

  function place(items) {
    let outer = (height - ribbonHeight - spacing * items.length) / 2 + spacing / 2;
    let inner = start;
    return items.map(item => {
      const thickness = item.amount / flow.size * ribbonHeight;
      const result = { ...item, thickness, inner, outer, labelY: outer + thickness / 2 };
      inner += thickness;
      outer += thickness + spacing;
      return result;
    });
  }

  return { height, start, ribbonHeight, left: place(flow.left), right: place(flow.right) };
}

function monthlyResults(state, month, today, length = 6) {
  return Array.from({ length }, (_, index) => {
    const selected = shiftMonth(month, index - length + 1);
    const { start, end } = periodFor(selected, today);
    const entries = currentEntries(state, start, end);
    const { revenue, spending } = resultFor(state, start, end);
    return { month: selected, revenue, spending, hasData: entries.length > 0 };
  });
}

function shortAmount(amount) {
  const absolute = Math.abs(amount);
  if (absolute < 1000) return money(amount);
  const scale = absolute >= 1_000_000 ? 1_000_000 : 1_000;
  const value = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 1 }).format(amount / scale);
  return `${value} ${scale === 1_000_000 ? 'M' : 'mil'}`;
}

function shortMonth(month) {
  return shortMonthFormatter.format(parseDate(month + '-01')).replace('.', '');
}

function historyChart(history, selected) {
  const values = history.filter(point => point.amount !== null);
  if (!values.length) return empty('Tu historial empieza aquí', 'Agrega los saldos de apertura o registra tus primeros movimientos.');
  const min = Math.min(...values.map(point => point.amount));
  const max = Math.max(...values.map(point => point.amount));
  const padding = Math.max((max - min) * 0.18, Math.abs(max) * 0.012, 1000);
  const low = min - padding;
  const high = max + padding;
  const left = 57, right = 625, top = 14, bottom = 147;
  const x = index => left + (right - left) * index / (history.length - 1);
  const y = amount => bottom - (bottom - top) * (amount - low) / (high - low);
  const points = history.flatMap((point, index) => point.amount === null ? [] : [{ ...point, x: x(index), y: y(point.amount) }]);
  const line = points.map((point, index) => `${index ? 'L' : 'M'}${point.x} ${point.y}`).join(' ');
  const area = `${line} L${points.at(-1).x} ${bottom} L${points[0].x} ${bottom} Z`;
  return `<svg class="history-chart" viewBox="0 0 646 174" role="group" aria-label="Evolución del patrimonio. Selecciona un mes.">
    <defs><linearGradient id="worth-fill" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#b1d9ff" stop-opacity=".46"/><stop offset="1" stop-color="#b1d9ff" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0, 1, 2].map(index => {
      const value = high - (high - low) * index / 2;
      return `<line class="chart-grid" x1="${left}" y1="${y(value)}" x2="${right}" y2="${y(value)}"/>
        <text class="chart-label" x="0" y="${y(value) + 4}">${shortAmount(value)}</text>`;
    }).join('')}
    <path d="${area}" fill="url(#worth-fill)"/>
    <path d="${line}" class="history-line"/>
    ${points.map(point => `<g class="history-point" role="button" tabindex="0"
        data-action="history-point" data-month="${point.month}" aria-pressed="${point.month === selected}"
        aria-label="${monthName(point.month)}, ${money(point.amount)}">
      <title>${monthName(point.month)} · ${money(point.amount)}</title>
      <circle cx="${point.x}" cy="${point.y}" r="14" fill="transparent"/>
      <circle class="point-halo" cx="${point.x}" cy="${point.y}" r="9"/>
      <circle class="point-dot" cx="${point.x}" cy="${point.y}" r="4"/></g>`).join('')}
    ${history.map((point, index) => history.length <= 6 || index % 2 === 1
      ? `<text class="chart-label" x="${x(index)}" y="171" text-anchor="middle">${shortMonth(point.month)}</text>`
      : '').join('')}
  </svg>`;
}

function trendChart(months, selected) {
  if (!months.some(point => point.hasData)) return empty('Todavía no hay movimientos para comparar', 'La serie aparecerá al registrar ingresos o gastos.');
  return seriesChart(months, [{ key: 'revenue', label: 'Ingresos', color: '#3065e9' },
    { key: 'spending', label: 'Gastos', color: '#e17b38' }], selected, true);
}

function seriesChart(points, lines, selected, interactive = false) {
  if (!points.length) return empty('Aún no hay datos', 'La evolución aparecerá al registrar movimientos.');
  const values = points.flatMap(point => lines.map(line => point[line.key] ?? 0));
  const maximum = Math.max(1, ...values), minimum = Math.min(0, ...values);
  const upper = maximum + Math.max(1, (maximum - minimum) * .08);
  const lower = minimum - Math.max(1, (maximum - minimum) * .08);
  const x = index => 68 + index * 590 / Math.max(1, points.length - 1);
  const y = value => 172 - (value - lower) / (upper - lower) * 146;
  return `<div class="series-chart">
    <div class="series-legend">${lines.map(line => `<span><i style="background:${line.color}"></i>${line.label}</span>`).join('')}</div>
    <svg viewBox="0 0 680 207" role="img" aria-label="Serie de tiempo: ${lines.map(line => line.label).join(' e ')}">
      ${[0, 1, 2].map(index => {
        const value = lower + (upper - lower) * index / 2;
        return `<line class="chart-grid" x1="68" y1="${y(value)}" x2="658" y2="${y(value)}"/>
          <text class="chart-label" x="0" y="${y(value) + 4}">${shortAmount(value)}</text>`;
      }).join('')}
      ${lines.map(line => `<path d="${points.map((point, index) => `${index ? 'L' : 'M'}${x(index)} ${y(point[line.key] ?? 0)}`).join(' ')}"
        fill="none" stroke="${line.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        ${points.map((point, index) => `<g ${interactive ? `role="button" tabindex="0" data-action="chart-month" data-month="${point.month}"
          aria-label="Ver ${monthName(point.month)}: ${line.label} ${money(point[line.key] ?? 0)}"` : ''}>
          <title>${monthName(point.month)} · ${line.label}: ${money(point[line.key] ?? 0)}</title>
          <circle cx="${x(index)}" cy="${y(point[line.key] ?? 0)}" r="12" fill="transparent"/>
          <circle cx="${x(index)}" cy="${y(point[line.key] ?? 0)}" r="${point.month === selected ? 5 : 3}"
            fill="${line.color}"/></g>`).join('')}`).join('')}
      ${points.map((point, index) => `<text class="chart-label" x="${x(index)}" y="202" text-anchor="middle">${shortMonth(point.month)}</text>`).join('')}
    </svg>
    ${interactive ? `<div class="series-months">${points.map(point => `<button type="button" data-action="chart-month" data-month="${point.month}"
      aria-pressed="${point.month === selected}" aria-label="Ver ${monthName(point.month)}">${shortMonth(point.month)}</button>`).join('')}</div>` : ''}
  </div>`;
}

function annualSpending(state, month, today) {
  let cumulative = 0;
  return Array.from({ length: Number(month.slice(5)) }, (_, index) => {
    const current = month.slice(0, 4) + '-' + String(index + 1).padStart(2, '0');
    const period = periodFor(current, today);
    cumulative += resultFor(state, period.start, period.end).spending;
    return { month: current, cumulative };
  });
}

function spendingChanges(changes, available) {
  if (!changes.length || !available) return empty('Aún no hay cambios para comparar', 'Aquí verás las categorías que más suben o bajan de un mes a otro.');
  return `<div class="spending-changes">${changes.map(row => `
    <div class="change-row"><span class="change-icon ${row.delta > 0 ? 'change-up' : ''}">${icon(row.delta > 0 ? 'expense' : 'income', 17)}</span>
      <div>${drill(row.account.id, esc(row.account.name))}<small>${money(row.previous)} → ${money(row.amount)}</small></div>
      <strong class="numeric">${signed(row.delta)}</strong>
    </div>`).join('')}</div>`;
}

function movementAmount(entry) {
  const amount = entry.lines.reduce((sum, line) => sum + line.debit, 0);
  return entry.type === 'income' ? signed(amount) : entry.type === 'expense' ? signed(-amount) : money(amount);
}

function sortedMovements(entries) {
  return entries.slice().reverse().sort((first, second) => second.date.localeCompare(first.date));
}

function movementRows(entries, accounts, { showDate = true } = {}) {
  if (!entries.length) return empty('Sin movimientos', 'Los movimientos que coincidan con esta vista aparecerán aquí.');
  return `<div class="movement-list">${entries.map(entry => {
    const from = accounts.get(entry.lines.find(line => line.credit > 0).account);
    const to = accounts.get(entry.lines.find(line => line.debit > 0).account);
    return `<button type="button" data-action="movement-detail" data-id="${esc(entry.id)}" class="movement-row">
      <span class="movement-icon">${icon(entry.type)}</span>
      <span class="movement-text"><strong>${esc(entry.description)}</strong>
        <small>${esc(from.name)} <span class="row-arrow">→</span> ${esc(to.name)}</small></span>
      <span class="movement-kind">${entry.status === 'draft' ? 'Borrador' : MOVEMENTS[entry.type]}</span>
      ${showDate ? `<span class="movement-date">${dateName(entry.date)}</span>` : ''}
      <strong class="numeric movement-amount">${movementAmount(entry)}</strong>${icon('chevron', 14)}
    </button>`;
  }).join('')}</div>`;
}

function cashForecastPanel(state) {
  const plan = projectedCash(state, today);
  const minimum = Math.min(plan.start, ...plan.events.map(item => item.balance));
  return `<section class="analysis-panel work-panel">${blockHeading('Caja próxima · 60 días', 'Saldo contable de efectivo y compromisos futuros. No modifica cuentas.')}
    <div class="debt-stats"><div><small>Disponible hoy</small><strong>${money(plan.start)}</strong></div>
      <div><small>Mínimo proyectado</small><strong>${signed(minimum)}</strong></div>
      <div><small>Al ${dateName(plan.end)}</small><strong>${signed(plan.events.at(-1)?.balance ?? plan.start)}</strong></div></div>
    ${button('cash-plan-new', 'Añadir ingreso o gasto previsto', { style: 'secondary small' })}
    <p class="field-note">Incluye estados de tarjeta emitidos y cuotas con fecha informada. Agrega sueldo, arriendo y otros pagos manualmente. Evita duplicar una cuota con un gasto previsto.</p>
    ${plan.events.length ? `<div class="forecast-chart" role="img" aria-label="Evolución proyectada del efectivo">
      ${[plan.start, ...plan.events.map(item => item.balance)].map(value => `<i style="height:${Math.max(7, Math.min(100, 50 + value / Math.max(1,Math.abs(minimum),Math.abs(plan.start)) * 45))}%" title="${signed(value)}"></i>`).join('')}</div>` : empty('Sin compromisos próximos', 'Añade un movimiento previsto para ver la proyección.')}
    ${plan.events.map(item => `<div class="statement-row"><span>${dateName(item.date)} · ${esc(item.label)}
      ${item.source === 'estimated' ? '<small>Fecha y cuota estimadas</small>' : ''}</span><span>${signed(item.amount)} · <strong>${signed(item.balance)}</strong>
      ${item.id ? `<button type="button" class="text-link" data-action="cash-plan-delete" data-id="${esc(item.id)}">Quitar</button>` : ''}</span></div>`).join('')}</section>`;
}

function openCashPlan() {
  modal('Movimiento previsto', `<form data-form="cash-plan">
    <p class="dialog-description">Es una proyección, no un movimiento contable. Regístralo en Movimientos cuando ocurra.</p>
    ${input('label', 'Concepto', { value: '', attributes: 'required maxlength="100"' })}
    <div class="field-grid">${input('date', 'Fecha', { type: 'date', value: localDate(new Date(parseDate(today).getTime() + 86400000)), attributes: `required min="${localDate(new Date(parseDate(today).getTime() + 86400000))}"` })}
      ${select('direction', 'Dirección', option('out', 'Salida') + option('in', 'Entrada'))}</div>
    ${numericInput('amount', 'Monto en CLP', '', { required: true })}${formFooter('Añadir a proyección')}</form>`);
}

function overview(state, context) {
  const { month, today, period, space, historyLength = 6, historyFocus, trendEnd = month } = context;
  const previous = comparablePeriod(month, today);
  const position = positionFor(state, period.end);
  const oldPosition = positionFor(state, previous.end);
  const result = resultFor(state, period.start, period.end);
  const oldResult = resultFor(state, previous.start, previous.end);
  const entries = currentEntries(state, period.start, period.end);
  const previousAvailable = currentEntries(state, null, previous.end).length > 0;
  const hasData = currentEntries(state, null, period.end).length > 0;
  const history = worthHistory(state, month, today, historyLength);
  const selected = history.find(point => point.month === historyFocus && point.amount !== null) ?? history.at(-1);
  const priorPoint = history[history.findIndex(point => point.month === selected.month) - 1];
  const notes = (current, prior) => comparison(current, prior, previousAvailable);
  const changes = result.expense.map(row => {
    const previous = oldResult.balances.get(row.account.id) ?? 0;
    return { ...row, previous, delta: row.amount - previous };
  }).filter(row => row.delta !== 0).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)).slice(0, 3);
  const resultValue = result.revenue - result.spending;
  const flow = ledgerFlow(result);

  return `${heading('Mi dinero', 'Tu patrimonio y lo que movió tus finanzas este mes.')}
    ${!hasData && space === 'personal' ? `<div class="notice starter-notice">
      <div><strong>Empieza por tus cuentas</strong><p>Agrega una cuenta con saldo inicial para ver tu patrimonio. La demo está disponible cuando quieras explorar.</p></div>
      ${button('account-new', 'Crear cuenta', { style: 'primary', glyph: 'plus' })}
    </div>` : ''}
    ${attentionSummary(state)}
    ${cashForecastPanel(state)}
    <section class="balance-hero" aria-label="Patrimonio contable">
      <div class="hero-summary">
        <p class="hero-kicker">PATRIMONIO CONTABLE</p>
        <strong class="hero-balance numeric">${selected.amount === null ? '—' : money(selected.amount)}</strong>
        <p class="hero-date">Al ${dateName(periodFor(selected.month, today).end)}</p>
        ${selected.amount !== null && priorPoint?.amount != null
          ? `<p class="hero-delta">${signed(selected.amount - priorPoint.amount)} vs. mes anterior</p>` : ''}
        <button type="button" class="hero-link" data-action="chart-balance" data-month="${selected.month}">Ver balance ${icon('arrow', 15)}</button>
      </div>
      <div class="hero-visual">
        <div class="hero-chart-heading"><span>Evolución del patrimonio</span>
          <div class="range-switch" role="group" aria-label="Meses de historial">
            ${[3, 6, 12].map(length => `<button type="button" data-action="history-range" data-length="${length}"
              aria-pressed="${length === historyLength}">${length}M</button>`).join('')}
          </div>
        </div>
        ${historyChart(history, selected.month)}
      </div>
    </section>
    ${state.goals.length ? `<section class="analysis-panel">
      ${blockHeading('Presupuestos por proyecto', 'Límite restante tras los gastos rendidos.',
        button('page', 'Ver presupuestos', { style: 'secondary small', attributes: 'data-page="budgets"', glyph: 'arrow' }))}
      <div class="project-numbers">${state.goals.slice(0, 3).map(goal => {
        return `<div><small>${esc(goal.name)}</small><strong>${signed(goal.target - goalSpending(state, goal.id, period.end))}</strong></div>`;
      }).join('')}</div></section>` : ''}
    <section class="home-story" aria-label="Resumen del mes">
      <div class="home-story-heading"><div><p class="eyebrow">ESTE MES</p><h2>De dónde vino y a dónde fue</h2>
        <p>Ingresos, gastos y resultado de ${monthName(month)}.</p></div>
        ${button('report', 'Explorar flujo', { style: 'secondary small', attributes: 'data-report="flow"', glyph: 'arrow' })}</div>
      <div class="home-figures">
        <div><span>Entró</span><strong class="numeric">${money(result.revenue)}</strong></div>
        <div><span>Salió</span><strong class="numeric">${money(result.spending)}</strong></div>
        <div><span>${resultValue < 0 ? 'Faltó' : 'Quedó'}</span><strong class="numeric">${money(Math.abs(resultValue))}</strong></div>
      </div>
      ${hasData ? sankey(flow, flowFocus) : empty('Aún no hay movimientos', 'Registra un ingreso o gasto para ver cómo fluye tu dinero.')}
    </section>
    <details class="home-more"><summary>Ver tendencias y movimientos recientes</summary>
      <div class="analysis-grid">
        <section class="analysis-panel">
          ${blockHeading('Ingresos y gastos por mes', 'Selecciona un mes para explorar ese período.')}
          ${trendChart(monthlyResults(state, trendEnd, today), month)}
        </section>
        <section class="analysis-panel">
          ${blockHeading('Qué cambió en tus gastos', 'Comparación con el mes anterior.')}
          ${spendingChanges(changes, previousAvailable)}
        </section>
      </div>
      <section class="detail-section">
        ${blockHeading('Movimientos recientes', 'Últimos registros del período.', button('page', 'Ver todos', { style: 'secondary small', attributes: 'data-page="movements"', glyph: 'arrow' }))}
        ${movementRows(sortedMovements(entries).slice(0, 4), accountIndex(state))}
      </section>
    </details>`;
}

function incomeStatement(state, { period }) {
  const result = resultFor(state, period.start, period.end);
  return `${heading('Estado de resultados', 'Ingresos, gastos y resultado del período seleccionado.')}
    <div class="statement-total"><span>Resultado del período</span><strong class="numeric">${signed(result.revenue - result.spending)}</strong></div>
    ${accountGroup('Ingresos', result.income, result.revenue, 'period')}
    ${accountGroup('Gastos', result.expense, result.spending, 'period')}`;
}

function balanceSheet(state, { period }) {
  const position = positionFor(state, period.end);
  const estimates = estimatedPosition(position, period.end);
  const equity = total(position.equity) + position.accumulated;
  return `${heading('Balance general', 'Activos, pasivos y patrimonio al ' + dateName(period.end) + '.')}
    <div class="statement-total"><span>Patrimonio contable</span><strong class="numeric">${money(position.netWorth)}</strong></div>
    ${accountGroup('Activos', position.assets, position.assetTotal, 'asof')}
    ${accountGroup('Pasivos', position.liabilities, position.liabilityTotal, 'asof')}
    ${accountGroup('Cuentas de patrimonio', position.equity, total(position.equity), 'asof')}
    <div class="statement-row"><span>Resultado acumulado</span><strong class="numeric">${money(position.accumulated)}</strong></div>
    <div class="statement-row"><span>Pasivos y patrimonio</span><strong class="numeric">${money(position.liabilityTotal + equity)}</strong></div>
    <div class="notice"><div><strong>Patrimonio con valoraciones</strong><p>${estimates.valued.length
      ? `${money(estimates.worth)} · ${estimates.valued.length === estimates.relevant.length ? 'Cobertura completa' : 'Cobertura parcial'} de activos valorables. Los pasivos se mantienen al valor contable.`
      : 'Valor contable disponible. Puedes añadir una valoración en el detalle de un activo.'}</p></div></div>`;
}

function cashStatement(state, { period }) {
  const flow = cashFlowFor(state, period);
  return `${heading('Flujo de efectivo', 'Entradas y salidas de efectivo por actividad durante el período.')}
    <div class="statement-total"><span>Efectivo final</span><strong class="numeric">${money(flow.ending)}</strong></div>
    <section class="statement-group">
      <div class="statement-row"><span>Efectivo anterior al período</span><strong class="numeric">${money(flow.prior)}</strong></div>
      ${flow.opening ? `<div class="statement-row"><span>Saldos iniciales incorporados</span><strong class="numeric">${signed(flow.opening)}</strong></div>` : ''}
      <div class="statement-row"><span>Efectivo inicial ${flow.opening ? 'ajustado' : ''}</span><strong class="numeric">${money(flow.initial)}</strong></div>
      ${Object.entries(CASH_CLASSES).map(([key, label]) => `<details class="flow-group">
        <summary><span>${label}</span><strong class="numeric">${signed(flow.flows[key])}</strong></summary>
        ${flow.details[key].length ? flow.details[key].map(({ entry, amount }) => `
          <div class="statement-row"><button type="button" class="text-link" data-action="movement-detail" data-id="${esc(entry.id)}">${esc(entry.description)}</button><span class="numeric">${signed(amount)}</span></div>`).join('')
          : '<p class="table-note">Sin movimientos de efectivo.</p>'}</details>`).join('')}
      <div class="statement-row"><span>Variación neta de efectivo</span><strong class="numeric">${signed(flow.change)}</strong></div>
    </section>
    <p class="reconcile">${flow.difference === 0 ? 'Conciliado' : 'Diferencia de conciliación'} · ${money(flow.difference)}</p>`;
}

function groupComposition(rows, profileLabels) {
  return Object.entries(profileLabels).map(([profile, label]) => ({
    label, rows: rows.filter(row => row.account.profile === profile),
  }));
}

function compositionChart(groups, label) {
  const parts = groups.map(group => ({ label: group.label, amount: total(group.rows) })).filter(part => part.amount !== 0);
  if (!parts.length) return '';
  const amount = total(parts);
  const allPositive = parts.every(part => part.amount > 0);
  const colors = ['#2856f5', '#7c60ea', '#30a9dc', '#5b83ff', '#a56de4', '#4974b7'];
  let offset = 0;
  const arcs = allPositive ? parts.map((part, index) => {
    const length = part.amount / amount * 100;
    const circle = `<circle cx="65" cy="65" r="52" pathLength="100" fill="none" stroke="${colors[index]}"
      stroke-width="14" stroke-dasharray="${length} ${100 - length}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 65 65)"/>`;
    offset += length;
    return circle;
  }).join('') : '';
  return `<section class="analysis-panel composition-card">
    ${blockHeading('Distribución por tipo', allPositive ? 'Participación de cada tipo en el saldo contable.' : 'Saldos positivos y negativos por tipo de cuenta.')}
    <div class="composition-content ${allPositive ? '' : 'composition-text'}">
      ${allPositive ? `<div class="donut">
        <svg viewBox="0 0 130 130" aria-hidden="true">${arcs}</svg><span>${label}</span>
      </div>` : ''}
      <div class="composition-legend">${parts.map((part, index) => `<div>
        <span><i style="--legend-tone:${colors[index]}"></i>${part.label}</span>
        <strong class="numeric">${money(part.amount)}</strong>
        ${allPositive ? `<small>${percent(part.amount / amount)}</small>` : ''}</div>`).join('')}</div>
    </div>
  </section>`;
}

function categoryChart(rows, label) {
  const positive = rows.filter(row => row.amount > 0).sort((a, b) => b.amount - a.amount);
  const sum = positive.reduce((total, row) => total + row.amount, 0);
  if (!sum) return empty('Sin categorías con movimiento', 'Registra movimientos para ver la distribución.');
  return `<section class="analysis-panel">${blockHeading(label, 'Porcentaje del total positivo por categoría; las reversiones reducen el importe neto.')}
    ${positive.map(row => `<div class="category-chart-row">${drill(row.account.id, esc(row.account.name))}
      <div class="project-track"><i style="width:${row.amount / sum * 100}%"></i></div>
      <strong>${percent(row.amount / sum)} · ${money(row.amount)}</strong></div>`).join('')}</section>`;
}

function balanceHistory(state, month, today, length = 12) {
  return Array.from({ length }, (_, index) => {
    const current = shiftMonth(month, index - length + 1);
    const position = positionFor(state, periodFor(current, today).end);
    return { month: current, assets: position.assetTotal, liabilities: position.liabilityTotal };
  });
}

function assetsReport(state, { period }) {
  const position = positionFor(state, period.end);
  const estimate = estimatedPosition(position, period.end);
  const hasEstimate = estimate.valued.length > 0;
  const hasAssets = position.assets.length > 0;
  const groups = groupComposition(position.assets, PROFILES.asset);
  return `${heading('Composición de activos', 'Valor contable y valoraciones manuales al ' + dateName(period.end) + '.')}
    <div class="report-metrics">
      ${metric('Activos contables', money(position.assetTotal), hasAssets ? 'Derivado del libro contable' : 'Sin cuentas de activo')}
      ${metric('Activos con valoraciones', hasEstimate ? money(estimate.assets) : '—', hasEstimate
        ? 'Cobertura ' + (estimate.valued.length === estimate.relevant.length ? 'completa' : 'parcial') : 'Sin valoraciones disponibles')}
      ${metric('Diferencia estimada', hasEstimate ? signed(estimate.assets - position.assetTotal) : '—',
        'Valoraciones manuales menos saldos contables; no modifica los estados financieros')}
    </div>
    <section class="analysis-panel">${blockHeading('Evolución de activos', 'Saldos contables al cierre de cada mes; las valoraciones manuales se muestran por separado.')}
      ${seriesChart(balanceHistory(state, period.end.slice(0, 7), today), [{ key: 'assets', label: 'Activos', color: '#3065e9' }], period.end.slice(0, 7), true)}</section>
    ${compositionChart(groups, 'Activos')}
    <div class="insight-row"><strong>Liquidez / activos</strong><span>${position.assetTotal > 0 ? percent(position.cash / position.assetTotal) : '—'}</span>
      <small>Proporción en efectivo y equivalentes, según la clasificación de tus cuentas.</small></div>

      ${estimate.valued.map(({ account, amount }) => `<div class="statement-row">

        <span class="numeric">${money(amount)} → ${money(account.estimate)}</span></div>`).join('')}</section>` : ''}`;
}

function liabilitiesReport(state, { period }) {
  const position = positionFor(state, period.end);
  const financial = total(position.liabilities.filter(row => row.account.profile !== 'unclassified'));
  const groups = groupComposition(position.liabilities, PROFILES.liability);
  return `${heading('Composición de pasivos', 'Saldo contable de tus obligaciones por tipo de deuda.')}
    <div class="report-metrics">
      ${metric('Pasivos totales', money(position.liabilityTotal), 'Todas las cuentas de pasivo')}
      ${metric('Deuda financiera', money(financial), 'Obligaciones clasificadas')}
