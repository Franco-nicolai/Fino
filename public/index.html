      ${seriesChart(balanceHistory(state, period.end.slice(0, 7), today), [{ key: 'liabilities', label: 'Deuda', color: '#e17b38' }], period.end.slice(0, 7), true)}</section>
    ${compositionChart(groups, 'Pasivos')}
    ${debtDashboard(state, period.end)}
    <section class="analysis-panel">${blockHeading('Tus deudas', `${position.liabilities.filter(row => row.amount > 0).length} cuentas con saldo`)}
      <div class="debt-list">${position.liabilities.filter(row => row.amount > 0).map(({ account, amount }) => `
        <button type="button" data-action="account-detail" data-id="${esc(account.id)}"><strong>${esc(account.name)}</strong><strong>${money(amount)}</strong>
          <small>${account.annualRateBps === undefined ? 'Interés sin informar' : 'Tasa anual ' + percent(account.annualRateBps / 10000)}
            · ${cardStatement(state, account.id, period.end) ? 'Vence ' + dateName(cardStatement(state, account.id, period.end).dueDate)
              : account.dueDay ? 'Ciclo estimado ' + dateName(nextPayment(account.dueDay, today)) : 'Vencimiento sin informar'}
            · ${account.paymentAccount ? 'Pagar desde ' + esc(state.accounts.find(item => item.id === account.paymentAccount)?.name ?? 'cuenta no disponible') : 'Sin cuenta de pago vinculada'}</small></button>`).join('')}</div></section>
    ${groups.filter(group => group.rows.length)
      .map(group => accountGroup(group.label, group.rows, total(group.rows), 'asof')).join('')}`;
}

function flowKind(item, side) {
  if (item.adjustment) return item.kind === 'expense' ? 'Reversión de gasto' : 'Reversión de ingreso';
  if (item.members) return side === 'in' ? 'Entradas agrupadas' : 'Salidas agrupadas';
  if (item.kind === 'balance') return 'Resultado contable';
  return item.kind === 'income' ? 'Ingreso' : 'Gasto';
}

function flowTone(item, side) {
  if (item.kind === 'balance') return side === 'in' ? 'flow-deficit' : 'flow-surplus';
  if (item.adjustment) return 'flow-adjustment';
  return side === 'in' ? 'flow-income' : 'flow-expense';
}

function flowRail(items, side, focused) {
  return `<div class="flow-rail ${side === 'in' ? 'flow-left' : 'flow-right'}">
    ${items.map(item => `<button type="button" class="flow-node ${flowTone(item, side)}" style="--node-y:${item.labelY}px"
      data-action="flow-select" data-id="${esc(item.key)}" aria-pressed="${focused === item.key}"
      aria-label="${esc(item.name + ', ' + flowKind(item, side) + ', ' + money(item.amount))}"
      title="${esc(item.name + ' · ' + flowKind(item, side))}">
      <span class="flow-node-name">${esc(item.name)}</span><strong class="numeric">${money(item.amount)}</strong>
      ${item.adjustment ? '<small>Reversión</small>' : ''}</button>`).join('')}
  </div>`;
}

function flowBands(items, side, focused) {
  const inbound = side === 'in';
  const [from, to] = inbound ? [8, 312] : [328, 632];
  const bend = (from + to) / 2;
  return items.map(item => {
    const { outer, inner, thickness, key, amount, name } = item;
    const y1 = inbound ? outer : inner;
    const y2 = inbound ? inner : outer;
    const curve = `M${from},${y1} C${bend},${y1} ${bend},${y2} ${to},${y2}
      L${to},${y2 + thickness} C${bend},${y2 + thickness} ${bend},${y1 + thickness} ${from},${y1 + thickness} Z`;
    return `<g class="flow-band ${flowTone(item, side)} ${focused && focused !== key ? 'flow-muted' : ''}"
      data-action="flow-select" data-id="${esc(key)}">
      <title>${esc(name)} · ${money(amount)}</title>
      <path d="${curve}"/>
      <rect x="${inbound ? 1 : 632}" y="${outer}" width="7" height="${Math.max(1, thickness)}" rx="2"/>
      </g>`;
  }).join('');
}

function flowDetail(item, flow) {
  if (!item) return `<div class="flow-hint">${icon('info', 17)} Selecciona una categoría para ver su peso y revisar los movimientos.</div>`;
  const side = flow.left.includes(item) ? 'in' : 'out';
  const categoryTotal = side === 'in' ? flow.sourceTotal : flow.useTotal;
  const kind = flowKind(item, side);
  const note = item.kind === 'balance'
    ? side === 'in' ? 'Los gastos netos superaron los ingresos netos del mes.' : 'Es la diferencia entre los ingresos y gastos netos del mes.'
    : `${percent(item.amount / categoryTotal)} de las ${side === 'in' ? 'entradas' : 'salidas'} por categoría.`;
  return `<div class="flow-detail" aria-live="polite">
    <div class="flow-detail-top">
      <div><small>${kind}</small><strong>${esc(item.name)}</strong><p>${note}</p></div>
      <strong class="flow-detail-amount numeric">${money(item.amount)}</strong>
      ${item.account ? drill(item.account, 'Ver movimientos ' + icon('arrow', 15)) : ''}
    </div>
    ${item.members ? `<details class="flow-members" open><summary>Ver ${item.members.length} categorías</summary>
      ${item.members.map(member => `<div class="statement-row">
        ${drill(member.account, esc(member.name) + (member.adjustment ? ' · reversión' : ''))}<span class="numeric">${money(member.amount)}</span></div>`).join('')}
      </details>` : ''}
  </div>`;
}

function sankey(flow, focused) {
  if (!flow.size) return empty('Sin flujos para este período', 'El diagrama aparece al contabilizar ingresos, gastos o sus reversiones.');
  const layout = flowLayout(flow);  const selected = [...flow.left, ...flow.right].find(item => item.key === focused);
  const selection = selected?.key;
  return `<div class="sankey-wrap">
    <div class="flow-columns" aria-hidden="true"><span>Entradas</span><span>Flujo del mes</span><span>Salidas y resultado</span></div>
    <div class="sankey-canvas" style="--flow-height:${layout.height}px" role="group" aria-label="Diagrama Sankey de ingresos y gastos">
      ${flowRail(layout.left, 'in', selection)}
      <svg viewBox="0 0 640 ${layout.height}" preserveAspectRatio="none" class="sankey-chart" aria-hidden="true">
        ${flowBands(layout.left, 'in', selection)}
        ${flowBands(layout.right, 'out', selection)}
        <rect class="flow-hub" x="312" y="${layout.start}" width="16" height="${layout.ribbonHeight}" rx="4"/>
      </svg>
      ${flowRail(layout.right, 'out', selection)}
    </div>
    ${flowDetail(selected, flow)}
  </div>`;
}

function flowReport(state, { period, month, today, flowFocus, trendEnd = month }) {
  const result = resultFor(state, period.start, period.end);
  const flow = ledgerFlow(result);
  const label = flow.difference < 0 ? 'Déficit' : flow.difference > 0 ? 'Excedente' : 'Resultado';
  return `${heading('Ingresos y gastos', 'Sigue tus ingresos desde su origen hasta los gastos y el resultado del mes.')}
    <section class="analysis-panel flow-card">
      ${blockHeading('Así se movió tu dinero', 'Cada banda tiene un ancho proporcional a su monto.', '<span class="chart-tag">Sankey</span>')}
      <div class="flow-totals">
        <div><span><i class="legend-income"></i>Ingresos netos</span><strong class="numeric">${money(result.revenue)}</strong></div>
        <div><span><i class="legend-expense"></i>Gastos netos</span><strong class="numeric">${money(result.spending)}</strong></div>
        <div><span><i class="${flow.difference < 0 ? 'legend-deficit' : 'legend-result'}"></i>${label}</span><strong class="numeric">${money(Math.abs(flow.difference))}</strong></div>
      </div>
      <p class="inline-insight">${result.revenue > 0 ? `Tasa de ahorro: <strong>${percent((result.revenue - result.spending) / result.revenue)}</strong>
        · Gastos / ingresos: <strong>${percent(result.spending / result.revenue)}</strong>` : 'Registra ingresos para calcular la tasa de ahorro.'}</p>
      ${sankey(flow, flowFocus)}
      <p class="flow-footnote">El flujo se basa en ingresos y gastos contabilizados. Las transferencias entre cuentas se muestran en el flujo de efectivo cuando corresponden.</p>
    </section>
    <section class="analysis-panel trend-panel">
      ${blockHeading('Ingresos y gastos en el tiempo', 'Selecciona un mes para actualizar el flujo.')}
      ${trendChart(monthlyResults(state, trendEnd, today), month)}
    </section>
    <section class="analysis-panel">${blockHeading('Gasto acumulado en ' + month.slice(0, 4),
      'Suma virtual de gastos contabilizados desde enero. No representa una cuenta ni dinero separado.')}
      <div class="insight-row"><strong>Acumulado hasta ${monthName(month)}: ${money(annualSpending(state, month, today).at(-1)?.cumulative ?? 0)}</strong></div>
      ${seriesChart(annualSpending(state, month, today), [{ key: 'cumulative', label: 'Acumulado anual', color: '#e17b38' }], month, true)}</section>
    <div class="analysis-grid">${categoryChart(result.income, 'Origen de los ingresos')}
      ${categoryChart(result.expense, 'Destino de los gastos')}</div>
    <details class="category-plans"><summary>Ver importes por categoría</summary><div class="flow-ledger-tables">
      ${accountGroup('Fuentes de ingreso', result.income, result.revenue, 'period')}
      ${accountGroup('Destinos del gasto', result.expense, result.spending, 'period')}
    </div></details>`;
}

function metricsReport(state, { period }) {
  const position = positionFor(state, period.end);
  const result = resultFor(state, period.start, period.end);
  const cash = cashFlowFor(state, period);
  const value = (numerator, denominator) => denominator > 0 ? percent(numerator / denominator) : 'No aplicable';
  const metrics = [
    ['Pasivos / activos', position.liabilityTotal, position.assetTotal, 'Qué proporción de tus activos financian los pasivos.'],
    ['Pasivos / patrimonio', position.liabilityTotal, position.netWorth, 'Carga de los pasivos respecto del patrimonio contable.'],
    ['Efectivo / activos', position.cash, position.assetTotal, 'Proporción de activos en efectivo y equivalentes.'],
    ['Cobertura de pasivos', position.cash, position.liabilityTotal, 'Pasivos que podrías cubrir con el efectivo disponible.'],
    ['Tasa de ahorro', result.revenue - result.spending, result.revenue, 'Resultado del período sobre ingresos contabilizados.'],
    ['Gastos / ingresos', result.spending, result.revenue, 'Parte de los ingresos consumida por los gastos.'],
    ['Flujo operativo / ingresos', cash.flows.operating, result.revenue, 'Flujo de operación respecto de los ingresos contabilizados.'],
  ];
  return `${heading('Métricas financieras', 'Indicadores derivados del mismo libro que alimenta los estados financieros.')}
    <div class="metric-table">${metrics.map(([name, numerator, denominator, explanation]) => `
      <div class="statement-row"><div><strong>${name}</strong><small>${explanation}</small></div><span class="numeric">${value(numerator, denominator)}</span></div>`).join('')}</div>`;
}

function reportsView(state, context) {
  const { report } = context;
  const views = { overview, flow: flowReport, assets: assetsReport, liabilities: liabilitiesReport,
    income: incomeStatement, balance: balanceSheet, cash: cashStatement };
  return `<nav class="tabs" aria-label="Informes">${Object.keys(REPORTS).map(key => `
    <button type="button" data-action="report" data-report="${key}" ${report === key ? 'aria-current="page"' : ''}>${REPORTS[key]}</button>`).join('')}</nav>
    <div class="report-body ${report === 'flow' ? 'report-flow' : ''}">${views[report](state, context)}</div>`;
}

function movementResults(state, { filters, period }) {
  const accounts = accountIndex(state);
  const search = filters.search.trim().toLocaleLowerCase('es-CL');
  const entries = sortedMovements(state.entries.filter(entry => {
    if (filters.type && filters.type !== (entry.status === 'draft' ? 'draft' : entry.type)) return false;
    if (filters.posted && entry.status !== 'posted') return false;
    if (filters.account && !entry.lines.some(line => line.account === filters.account)) return false;
    if (filters.range !== 'all' && entry.date > period.end) return false;
    if (filters.range === 'period' && entry.date < period.start) return false;
    return !search || [entry.description, ...entry.lines.map(line => accounts.get(line.account).name)]
      .some(text => text.toLocaleLowerCase('es-CL').includes(search));
  }));
  return `<p class="list-count">${entries.length} ${entries.length === 1 ? 'movimiento' : 'movimientos'}${filters.posted ? ' contabilizados' : ''}</p>
    ${movementRows(entries, accounts)}`;
}

function option(value, label, selected) {
  return `<option value="${esc(value)}" ${value === selected ? 'selected' : ''}>${esc(label)}</option>`;
}

function reconciliationPanel(state) {
  const records = (state.reconciliations ?? []).slice().sort((a,b) => b.date.localeCompare(a.date));
  return `<details class="analysis-panel work-panel"><summary>Conciliación bancaria · ${records.length} cortes</summary>
    <p class="field-note">Compara tu extracto con movimientos contabilizados. Marcar partidas no altera el libro ni crea asientos.</p>
    ${button('reconcile-open', 'Conciliar cuenta', { style: 'secondary' })}
    ${records.slice(0, 8).map(item => {
      const actual = item.entries.reduce((sum,id) => {
        const entry = state.entries.find(entry => entry.id === id && entry.status === 'posted');
        return sum + (entry ? cashEffect(entry, item.account) : 0);
      }, 0);
      return `<div class="statement-row"><span>${esc(state.accounts.find(a => a.id === item.account)?.name ?? 'Cuenta')} · ${dateName(item.date)}
        <small>${actual === item.balance ? 'Conciliado' : 'Revisar: el libro cambió desde este corte'}</small></span>
        <strong>${money(item.balance)}</strong></div>`;
    }).join('')}</details>`;
}

function openReconciliation(accountId, cutoff) {
  const accounts = state.accounts.filter(item => item.kind === 'asset' && item.profile === 'cash');
  if (!accounts.length) return showError(new Error('Crea una cuenta de efectivo primero.'));
  const account = accounts.find(item => item.id === accountId) ?? accounts[0];
  const date = cutoff && isDate(cutoff) && cutoff <= today ? cutoff : today;
  const prior = (state.reconciliations ?? []).find(item => item.account === account.id && item.date === date);
  const entries = state.entries.filter(item => item.status === 'posted' && item.date <= date && cashEffect(item, account.id))
    .sort((a,b) => a.date.localeCompare(b.date));
  modal('Conciliar extracto', `<form data-form="reconciliation">
    <p class="dialog-description">Selecciona todos los movimientos que aparecen en el extracto, incluido el saldo inicial. Deja sin marcar los pendientes.</p>
    <div class="field-grid">${select('account', 'Cuenta', accounts.map(item => option(item.id, item.name, account.id)).join(''))}
      ${input('date', 'Fecha de corte', { type: 'date', value: date, attributes: `required max="${today}"` })}</div>
    ${numericInput('balance', 'Saldo final del extracto (CLP)', prior?.balance ?? positionFor(state, date).balances.get(account.id) ?? 0, { required: true, min: -MAX_AMOUNT })}
    <div class="reconcile-list">${entries.map(entry => `<label><input type="checkbox" name="entry" value="${esc(entry.id)}" ${!prior || prior.entries.includes(entry.id) ? 'checked' : ''}>
      <span>${dateName(entry.date)} · ${esc(entry.description)}</span><strong>${signed(cashEffect(entry, account.id))}</strong></label>`).join('') || '<p>Sin movimientos en esta cuenta.</p>'}</div>
    <p class="scenario-result" data-reconcile-difference></p>${formFooter('Guardar conciliación')}</form>`);
  updateReconciliationDifference(dialog.querySelector('form'));
}

function updateReconciliationDifference(form) {
  const account = form.elements.account.value;
  const selected = [...form.querySelectorAll('[name="entry"]:checked')];
  const book = selected.reduce((sum, input) => sum + cashEffect(state.entries.find(item => item.id === input.value), account), 0);
  const balance = form.elements.balance.valueAsNumber;
  form.querySelector('[data-reconcile-difference]').textContent = `Seleccionado ${money(book)} · diferencia ${Number.isFinite(balance) ? signed(balance - book) : '—'}`;
}

function movementsView(state, context) {
  const { filters } = context;
  return `${heading('Movimientos', 'Consulta y registra lo que entra, sale o se transfiere entre tus cuentas.')}
    ${reconciliationPanel(state)}
    <div class="filter-bar">
      <label class="search-field">${icon('search', 17)}<input type="search" id="movement-search" placeholder="Buscar movimiento" aria-label="Buscar movimiento" value="${esc(filters.search)}"></label>
      <select data-filter="range" aria-label="Rango de movimientos">
        ${option('period', 'Mes seleccionado', filters.range)}${option('asof', 'Hasta el corte', filters.range)}${option('all', 'Todos los períodos', filters.range)}
      </select>
      <select data-filter="type" aria-label="Tipo de movimiento">
        ${option('', 'Todos los tipos', filters.type)}${Object.entries(MOVEMENTS).map(([id, name]) => option(id, name, filters.type)).join('')}
        ${option('draft', 'Borradores', filters.type)}
      </select>
      <select data-filter="account" aria-label="Cuenta">
        ${option('', 'Todas las cuentas', filters.account)}${state.accounts.map(account => option(account.id, account.name, filters.account)).join('')}
      </select>
      ${filters.posted ? button('clear-filter', 'Quitar filtro del informe', { style: 'secondary small' }) : ''}
    </div><div id="movement-results">${movementResults(state, context)}</div>`;
}

function accountsView(state, { period }) {
  const position = positionFor(state, period.end);
  return `${heading('Cuentas', 'Tus cuentas y categorías existentes.')}
    <div class="section-toolbar"><span>Saldos al ${dateName(period.end)}</span>${button('account-new', 'Nueva cuenta', { style: 'secondary', glyph: 'plus' })}</div>
    ${Object.entries(CLASSES).map(([kind, label]) => {
      const rows = state.accounts.filter(account => account.kind === kind);
      return `<section class="statement-group">
        <div class="statement-heading"><h2>${label}</h2><strong class="numeric">${money(rows.reduce((sum, account) => sum + position.balances.get(account.id), 0))}</strong></div>
        ${rows.length ? rows.map(account => `<button type="button" class="account-row" data-action="account-detail" data-id="${esc(account.id)}">
          <span><strong>${esc(account.name)}</strong><small>${account.id === OPENING_EQUITY ? 'Cuenta de sistema'
            : account.active ? (PROFILES[kind]?.[account.profile] ?? label) : 'Desactivada'}</small></span>
          <span class="numeric">${money(position.balances.get(account.id))}</span>${icon('chevron', 14)}</button>`).join('')
          : '<p class="table-note">Sin cuentas.</p>'}</section>`;
    }).join('')}`;
}

function budgetsView(state, { month, period }) {
  const result = resultFor(state, period.start, period.end);
  const accounts = accountIndex(state);
  const plans = state.budgets.filter(budget => budget.month === month);
  return `${heading('Presupuestos', 'Define el máximo de cada proyecto y rinde gastos vinculados a él.')}
    ${goalsView(state, { today })}
    <details class="category-plans"><summary>Presupuestos mensuales por categoría · ${monthName(month)}</summary>
    <div class="section-toolbar"><span>Plan mensual</span>${button('budget-new', 'Definir categoría', { style: 'secondary', glyph: 'plus' })}</div>
    ${!plans.length ? empty('Sin presupuestos para este mes', 'Elige una categoría y define un importe planificado.')
      : ['expense', 'income'].map(kind => {
        const rows = plans.filter(item => accounts.get(item.account).kind === kind);
        return `<section class="statement-group"><div class="statement-heading"><h2>${CLASSES[kind]}</h2></div>
          ${rows.length ? `<div class="table-scroll"><table><thead><tr><th>Categoría</th><th>${kind === 'income' ? 'Esperado' : 'Planificado'}</th>
            <th>Real</th><th>${kind === 'income' ? 'Diferencia' : 'Disponible'}</th><th>${kind === 'income' ? 'Avance' : 'Utilizado'}</th></tr></thead>
            <tbody>${rows.map(row => {
              const actual = result.balances.get(row.account);
              return `<tr><th><button type="button" class="text-link" data-action="budget-edit" data-id="${esc(row.account)}">${esc(accounts.get(row.account).name)}</button></th>
                <td>${money(row.planned)}</td><td>${drill(row.account, money(actual))}</td>
                <td>${signed(kind === 'income' ? actual - row.planned : row.planned - actual)}</td>
                <td>${row.planned ? percent(actual / row.planned) : '—'}

                    aria-hidden="true"><i style="width:${Math.max(0, Math.min(100, actual / row.planned * 100))}%"></i></div>` : ''}
                  ${kind === 'expense' && actual > row.planned ? '<small class="over-budget">Sobre el plan</small>' : ''}</td></tr>`;
            }).join('')}</tbody></table></div>` : '<p class="table-note">Sin categorías planificadas.</p>'}
          </section>`;
      }).join('')}</details>`;
}

function goalsView(state, { today }) {
  const position = positionFor(state, today);
  return `<section class="project-budgets"><div class="section-toolbar"><strong>Por proyecto</strong>${button('goal-new', 'Nuevo presupuesto', { style: 'secondary', glyph: 'plus' })}</div>
    <p class="field-note">El límite es virtual. Cada gasto vinculado descuenta del presupuesto, sin crear otra cuenta contable.</p>
    ${!state.goals.length ? empty('Sin presupuestos por proyecto', 'Crea un presupuesto para un viaje u otro propósito y vincula sus gastos.')
      : `<div class="goal-list">${state.goals.map(goal => {
        const amount = goal.allocations.reduce((sum, allocation) => sum + allocation.amount, 0);
        const spent = goalSpending(state, goal.id, today);
        const remaining = goal.target - spent;
        const ratio = spent / goal.target;
        const uncovered = goal.allocations.some(allocation =>
          reservedIn(state, allocation.account) > (position.balances.get(allocation.account) ?? 0));
        return `<section class="goal">
          ${blockHeading(esc(goal.name), uncovered ? 'Revisa la reserva opcional de una cuenta.' : 'Límite · rendido · disponible',
            button('goal-detail', 'Ver gastos', { style: 'secondary small', attributes: `data-id="${esc(goal.id)}"` }))}
          <div class="project-numbers"><div><small>Límite</small><strong>${money(goal.target)}</strong></div>
            <div><small>Rendido</small><strong>${money(spent)}</strong></div><div><small>Disponible</small><strong>${signed(remaining)}</strong></div></div>
          <div class="project-track" role="img" aria-label="${percent(Math.min(1, ratio))} del presupuesto gastado">
            <i style="width:${Math.min(100, Math.max(0, ratio * 100))}%"></i></div>
          <div class="goal-footer"><span>${spent > goal.target ? 'Excedido por ' + money(spent - goal.target) : percent(ratio) + ' del límite utilizado'}</span>
            <span>${amount ? money(amount) + ' reservado en cuenta' : 'Sin reserva bancaria'}</span></div>
        </section>`;
      }).join('')}</div>`}</section>`;
}

function nextPayment(day, cutoff) {
  const month = cutoff.slice(0, 7);
  const dateFor = month => month + '-' + String(Math.min(day, Number(monthEnd(month).slice(8)))).padStart(2, '0');
  const date = dateFor(month);
  return date < cutoff ? dateFor(shiftMonth(month, 1)) : date;
}

function attentionSummary(state) {
  const balances = positionFor(state, today).balances;
  const notices = [];
  for (const account of state.accounts.filter(item => item.kind === 'liability' && item.active)) {
    const balance = Math.max(0, balances.get(account.id) ?? 0);
    if (!balance) continue;
    if (account.limit && balance >= account.limit * .8)
      notices.push({ id: account.id, text: `${account.name}: ${percent(balance / account.limit)} del cupo utilizado` });
    const statement = cardStatement(state, account.id);
    if (statement) {
      const pending = Math.max(0, statement.billed - statementPayments(state, statement));
      const days = Math.round((parseDate(statement.dueDate) - parseDate(today)) / 86400000);
      if (pending && days <= 7) notices.push({ id: account.id,
        text: `${account.name}: ${days < 0 ? 'vencimiento hace ' + Math.abs(days) + ' días' : 'vence en ' + days + ' días'} · pendiente estimado ${money(pending)}` });
    } else if (account.dueDay) {
      const date = nextPayment(account.dueDay, today);
      const days = (new Date(date + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000;
      if (days <= 7) notices.push({ id: account.id,
        text: `${account.name}: revisa el vencimiento estimado del ciclo (${dateName(date)})` });
    }
  }
  return notices.length ? `<section class="notice attention-summary" role="status"><div><strong>Revisa tus deudas</strong>
    <div class="attention-links">${notices.slice(0, 3).map(item => `<button type="button" data-action="account-detail" data-id="${esc(item.id)}">${esc(item.text)} ${icon('arrow', 13)}</button>`).join('')}</div></div>
    ${button('report', 'Ver deuda', { style: 'secondary small', attributes: 'data-report="liabilities"', glyph: 'arrow' })}</section>` : '';
}

function debtDashboard(state, cutoff) {
  const position = positionFor(state, cutoff);
  const accounts = position.liabilities.filter(row => row.account.profile !== 'unclassified');
  const cards = accounts.filter(row => ['card', 'line'].includes(row.account.profile));
  const months = [3, 2, 1].map(offset => shiftMonth(cutoff.slice(0, 7), -offset));
  const income = months.map(month => resultFor(state, month + '-01', monthEnd(month)).revenue);
  const average = income.reduce((sum, value) => sum + value, 0) / months.length;
  const historicalExpenses = months.reduce((sum, month) => sum
    + resultFor(state, month + '-01', monthEnd(month)).spending, 0) / months.length;
  const obligation = account => {
    const statement = cardStatement(state, account.id, cutoff);
    if (statement) return Math.max(0, statement.minimum - statementPayments(state, statement, cutoff));
    return account.monthlyPayment ?? account.minimum ?? 0;
  };
  const required = accounts.reduce((sum, row) => sum + obligation(row.account), 0);
  const fees = accounts.reduce((sum, row) => sum + (row.account.monthlyFee ?? 0), 0);
  const missing = accounts.filter(row => row.amount > 0 && !cardStatement(state, row.account.id, cutoff)
    && !row.account.monthlyPayment && !row.account.minimum);
  const balanceAfter = essentialScenario === null ? null : Math.floor(average - essentialScenario - required - newPaymentScenario);
  const proposal = loanScenario(newPaymentScenario, loanRateScenario, loanMonthsScenario);
  const alerts = cards.filter(row => row.account.limit && row.amount / row.account.limit >= .8)
    .map(row => `${row.account.name}: ${percent(row.amount / row.account.limit)} del cupo utilizado`);
  const soon = accounts.filter(row => row.amount > 0 && row.account.dueDay && !cardStatement(state, row.account.id))
    .map(row => ({ row, date: nextPayment(row.account.dueDay, today) }))
    .filter(item => (parseDate(item.date) - parseDate(today)) / 86400000 <= 7);
  return `<section class="analysis-panel debt-panel">
    ${blockHeading('Flujo mensual y nueva cuota', 'Escenario editable: ingreso menos gastos esenciales, compromisos de deuda y cuota propuesta.')}
    <div class="insight-row"><strong>Deuda / activos: ${position.assetTotal > 0 ? percent(position.liabilityTotal / position.assetTotal) : '—'}</strong>
      <strong>Efectivo / deuda: ${position.liabilityTotal > 0 ? percent(position.cash / position.liabilityTotal) : '—'}</strong>
      <small>Saldos contables al corte. Estas relaciones describen la posición; no calculan una capacidad de crédito aprobada.</small></div>
    <div class="debt-stats"><div><small>Ingreso mensual promedio</small><strong>${money(average)}</strong></div>
      <div><small>Gasto histórico promedio</small><strong>${money(historicalExpenses)}</strong></div>
      <div><small>Cuotas y mínimos informados</small><strong>${money(required)}</strong></div></div>
    ${fees ? `<p class="field-note">Comisiones mensuales informadas: ${money(fees)} (${money(fees * 12)} en 12 meses si no cambian). No están contabilizadas hasta que registres el gasto.</p>` : ''}
    <div class="scenario-fields"><label>Gastos esenciales mensuales (CLP)
      <input type="number" min="0" max="${MAX_AMOUNT}" step="1" placeholder="Ingresa tu estimación" value="${essentialScenario ?? ''}" data-scenario="essential"></label>
      <label>Nueva cuota propuesta (CLP)
      <input type="number" min="0" max="${MAX_AMOUNT}" step="1" value="${newPaymentScenario}" data-scenario="new-payment"></label></div>
    <div class="scenario-fields"><label>Tasa anual propuesta (%)<input type="number" min="0" max="100" step="0.01" value="${loanRateScenario}" data-scenario="loan-rate"></label>
      <label>Plazo (meses)<input type="number" min="1" max="360" step="1" value="${loanMonthsScenario}" data-scenario="loan-months"></label></div>
    <p class="scenario-result">Con la cuota propuesta: capital aproximado <strong>${money(proposal.principal)}</strong> · pago total ${money(proposal.total)} · intereses aproximados ${money(proposal.interest)}.
      Cuotas actuales y nueva / ingreso: ${average > 0 ? percent((required + newPaymentScenario) / average) : '—'}.</p>
    <p class="field-note">Cálculo con tasa fija y cuotas mensuales constantes; excluye seguros, impuestos y comisiones.</p>
    <p class="field-note">Usa el gasto histórico solo como referencia: incluye compras con tarjeta y puede mezclar gastos esenciales con otros. Evita contar dos veces las mismas cuotas o comisiones.</p>
    <p class="scenario-result">${average > 0 && !missing.length && balanceAfter !== null
      ? `Saldo mensual del escenario: <strong>${signed(balanceAfter)}</strong> · cuotas informadas / ingreso: ${percent(required / average)}`
      : 'Ingresa tus gastos esenciales y registra las cuotas o mínimos de las deudas con saldo para ver el escenario.'}</p>
    <p class="field-note">Estimación para decidir qué revisar; no calcula aprobación, intereses futuros ni costo total del crédito.</p>
    ${cards.length ? `<h3>Tarjetas y líneas</h3><div class="card-grid">${cards.map(({ account, amount }) => `<button type="button" class="credit-card" data-action="account-detail" data-id="${esc(account.id)}">
      <span><strong>${esc(account.name)}</strong><small>${esc(account.institution ?? 'Crédito')}</small></span>
      <strong class="numeric">${account.limit ? percent(Math.max(0, amount) / account.limit) : 'Sin cupo registrado'}</strong>
      <div class="credit-track"><i style="width:${account.limit ? Math.min(100, Math.max(0, amount / account.limit * 100)) : 0}%"></i></div>
      <small>${money(Math.max(0, amount))} usado · ${account.limit ? money(Math.max(0, account.limit - amount)) + ' disponible' : 'registra el cupo'}
        ${cardStatement(state, account.id, cutoff) ? ' · facturado ' + money(cardStatement(state, account.id, cutoff).billed) + ' · vence ' + dateName(cardStatement(state, account.id, cutoff).dueDate) : ' · falta el estado emitido'}
        ${account.monthlyFee !== undefined ? ' · comisión estimada ' + money(account.monthlyFee) + '/mes' : ''}</small></button>`).join('')}</div>` : ''}
    ${alerts.length || soon.length ? `<div class="debt-alerts" role="status">${alerts.map(text => `<p>${esc(text)}</p>`).join('')}
      ${soon.map(({ row, date }) => `<p>${esc(row.account.name)}: fecha estimada ${dateName(date)}. Registra el estado emitido para conocer el vencimiento real.</p>`).join('')}</div>` : ''}
  </section>`;
}


const content = document.querySelector('#content');
const navigation = document.querySelector('#sidebar');
const topbar = document.querySelector('#topbar');
const dialog = document.querySelector('#dialog');
const toast = document.querySelector('#toast');
const today = localDate();
const thisMonth = today.slice(0, 7);

function storedPreference(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function setPreference(key, value) {
  try { localStorage.setItem(key, value); } catch { /* IndexedDB holds the financial data. */ }
}

const defaultFilters = () => ({ search: '', type: '', account: '', range: 'period', posted: false });
let space = storedPreference('fino-space') === 'demo' ? 'demo' : 'personal';
let month = space === 'personal' ? thisMonth : DEMO_MONTH;
let page = Object.hasOwn(PAGES, location.hash.slice(1)) ? location.hash.slice(1) : 'reports';
let report = 'overview';
let other = 'assets';
let historyLength = 6;
let essentialScenario = null;
let newPaymentScenario = 0;
let loanRateScenario = 18;
let loanMonthsScenario = 24;
let historyFocus;
let flowFocus;
let trendEnd;
let filters = defaultFilters();
let state;
let busy = false;
let toastTimer;

const context = () => ({
  space, month, page, report, other, today, filters, historyLength, historyFocus, flowFocus, trendEnd,
  period: periodFor(month, today),
});

function render() {
  const views = { reports: reportsView, movements: movementsView, accounts: accountsView, budgets: budgetsView };
  const previousTabsScroll = content.querySelector('.tabs')?.scrollLeft ?? 0;
  navigation.innerHTML = sidebar(page, space);
  topbar.innerHTML = `
    <div class="breadcrumb"><strong>${PAGES[page]}</strong></div>
    <div class="topbar-actions">
      ${periodControl(month, today)}
      ${button('movement-new', 'Añadir', { style: 'primary', glyph: 'plus' })}
    </div>`;
  const storageNotice = usesTemporaryStorage()
    ? '<div class="notice"><div><strong>Datos guardados en este navegador</strong><p>Fino usa almacenamiento local. Conserva un respaldo JSON si cambias de archivo o navegador.</p></div></div>'
    : '';
  content.innerHTML = storageNotice + views[page](state, context());
  const tabs = content.querySelector('.tabs');
  if (tabs) tabs.scrollLeft = previousTabsScroll;
}

function refreshMovements() {
  const results = document.querySelector('#movement-results');
  if (results) results.innerHTML = movementResults(state, context());
}

function navigate(to) {
  if (!Object.hasOwn(PAGES, to)) return;
  page = to;
  if (to === 'movements') filters = defaultFilters();
  history.replaceState(null, '', '#' + page);
  render();
  content.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function selectReport(to) {
  if (Object.hasOwn(REPORTS, to)) {
    report = to;
  } else {
    return;
  }
  render();
  content.querySelector('.tabs [aria-current="page"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  content.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function notify(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.hidden = false;
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
}

function modal(title, body, { drawer = false, caption = '' } = {}) {
  dialog.className = drawer ? 'drawer' : 'form-dialog';
  dialog.innerHTML = `<div class="dialog-heading"><div>${caption ? `<p class="eyebrow">${caption}</p>` : ''}
    <h2 id="dialog-title">${title}</h2></div>
    <button class="icon-button" type="button" data-action="close" aria-label="Cerrar">${icon('close')}</button>
    </div><div class="dialog-body">${body}</div><p class="form-error" role="alert" hidden></p>`;
  if (!dialog.open) dialog.showModal();
  const firstField = dialog.querySelector('form input:not([type=hidden]), form select:not([disabled])');
  (firstField ?? dialog.querySelector('.icon-button')).focus();
}

function showError(error) {
  const message = error?.message || 'Vuelve a intentar la operación.';
  const target = dialog.querySelector('.form-error');
  if (dialog.open && target) {
    target.textContent = message;
    target.hidden = false;
  } else {
    notify(message);
  }
}

function confirmAction(title, explanation, action, label, id, danger = false) {
  modal(title, `<p class="dialog-description">${explanation}</p>
    <div class="dialog-actions">${button('close', 'Cancelar', { style: 'secondary' })}
      ${button(action, label, { style: danger ? 'danger' : 'primary', attributes: `data-id="${esc(id)}"` })}</div>`);
}

function formFooter(label, extras = '') {  return `<div class="dialog-actions">${button('close', 'Cancelar', { style: 'secondary' })}${extras}
    <button class="button primary" type="submit">${label}</button></div>`;
}

function input(name, label, { value = '', type = 'text', attributes = '' } = {}) {
  const field = `<input name="${name}" type="${type}" value="${esc(value)}" ${attributes}>`;
  return `<label>${label}${type === 'date'
    ? `<span class="date-entry">${field}<button type="button" data-action="calendar" aria-label="Abrir calendario para ${esc(label)}">${icon('calendar', 17)}</button></span>`
    : field}</label>`;
}

function numericInput(name, label, value, { min = 0, max = MAX_AMOUNT, required = false } = {}) {
  return input(name, label, { value, type: 'number', attributes: `min="${min}" max="${max}" step="1" inputmode="numeric" ${required ? 'required' : ''}` });
}

function select(name, label, options, attributes = '') {
  return `<label>${label}<select name="${name}" ${attributes}>${options}</select></label>`;
}

function nullableNumber(form, name) {
  return form.elements[name].value === '' ? null : form.elements[name].valueAsNumber;
}

function entryDate() {
  return periodFor(month, today).end;
}

function activeOptions(accounts, selected, prompt = 'Selecciona una cuenta') {
  return option('', prompt, selected) + accounts.map(account => option(account.id, account.name, selected)).join('');
}

function movementOptions(form, values = {}) {
  const type = form.elements.type.value;
  const active = state.accounts.filter(account => account.active);
  const from = form.elements.from;
  const to = form.elements.to;
  const activeBalance = active.filter(account => ['asset', 'liability'].includes(account.kind));
  const sources = type === 'income' ? active.filter(account => account.kind === 'income') : activeBalance;
  const targets = type === 'expense' ? active.filter(account => account.kind === 'expense')
    : type === 'income' ? active.filter(account => account.kind === 'asset') : activeBalance;
  const captions = { income: ['Categoría de ingreso', 'Recibido en'], expense: ['Pagado con', 'Categoría de gasto'], transfer: ['Origen', 'Destino'] };
  form.querySelector('[data-from-label]').textContent = captions[type][0];
  form.querySelector('[data-to-label]').textContent = captions[type][1];
  from.innerHTML = activeOptions(sources, values.from ?? from.value);
  to.innerHTML = activeOptions(targets, values.to ?? to.value);
  form.querySelector('[data-cash-class]').hidden = type !== 'transfer';
  form.querySelector('[data-project-field]').hidden = type !== 'expense';
  const help = form.querySelector('[data-movement-help]');
  help.hidden = Boolean(sources.length && targets.length);
}

function openMovement(id) {
  const entry = id && state.entries.find(item => item.id === id);
  if (entry && entry.status !== 'draft') return showMovement(entry.id);
  const type = entry?.type ?? 'expense';
  modal(entry ? 'Editar borrador' : 'Nuevo movimiento', `<form data-form="movement" data-id="${esc(id)}">
    ${select('type', 'Tipo', ['income', 'expense', 'transfer'].map(key => option(key, MOVEMENTS[key], type)).join(''))}
    ${input('description', 'Concepto', { value: entry?.description, attributes: 'required maxlength="120" placeholder="Ej. Compra del supermercado"' })}
    <div class="field-grid">
      <label><span data-from-label>Origen</span><select name="from" required></select></label>
      <label><span data-to-label>Destino</span><select name="to" required></select></label>
    </div>
    <div class="notice form-notice" data-movement-help hidden><div>Necesitas cuentas activas para registrar este tipo de movimiento.</div>
      ${button('account-new', 'Crear cuenta', { style: 'secondary small' })}</div>
    <div class="field-grid">
      ${numericInput('amount', 'Monto en CLP', entry?.lines[0].debit, { min: 1, required: true })}
      ${input('date', 'Fecha', { type: 'date', value: entry?.date ?? entryDate(), attributes: `required max="${today}"` })}
    </div>
    <div data-cash-class hidden>${select('cashClass', 'Actividad del flujo de efectivo',
      option('auto', 'Clasificación automática') + Object.entries(CASH_CLASSES).map(([key, name]) => option(key, name, entry?.cashClass)).join(''))}
      <small class="field-note">Los traspasos entre cuentas de efectivo se compensan en el informe.</small></div>
    <div data-project-field>${select('goal', 'Presupuesto (opcional)',
      option('', 'Sin presupuesto', entry?.goal) + state.goals.map(goal => option(goal.id, goal.name, entry?.goal)).join(''))}
      <small class="field-note">El gasto se rinde contra el límite del presupuesto, sin mover fondos.</small></div>
    ${formFooter('Contabilizar', '<button class="button secondary" type="submit" name="draft" value="true">Guardar borrador</button>')}
  </form>`);
  movementOptions(dialog.querySelector('form'), { from: entry?.lines[1].account, to: entry?.lines[0].account });
}

function openCardPayment(id) {
  const card = state.accounts.find(account => account.id === id);
  if (!card?.paymentAccount) return;
  openMovement();
  const form = dialog.querySelector('form');
  form.elements.type.value = 'transfer';
  movementOptions(form, { from: card.paymentAccount, to: card.id });
  form.elements.description.value = 'Pago de ' + card.name;
  const balance = positionFor(state, today).balances.get(id) ?? 0;
  const statement = cardStatement(state, id);
  const due = statement ? Math.max(0, statement.billed - statementPayments(state, statement)) : balance;
  if (balance > 0) form.elements.amount.value = Math.min(balance, due || balance);
}

function openStatement(id) {
  const account = state.accounts.find(item => item.id === id && item.kind === 'liability'
    && ['card', 'line'].includes(item.profile));
  if (!account) return;
  const latest = cardStatement(state, id);
  modal('Estado de cuenta · ' + esc(account.name), `<form data-form="statement" data-id="${esc(id)}">
    <p class="dialog-description">Copia los datos del último estado emitido por la entidad. Este registro informativo no crea asientos ni modifica el saldo contable.</p>
    <div class="field-grid">${input('issueDate', 'Fecha de emisión', { type: 'date', value: latest?.issueDate ?? today, attributes: `required max="${today}"` })}
      ${input('dueDate', 'Vence el', { type: 'date', value: latest?.dueDate ?? nextPayment(account.dueDay ?? 15, today), attributes: 'required' })}</div>
    <div class="field-grid">${numericInput('billed', 'Total facturado en CLP', latest?.billed, { required: true })}
      ${numericInput('minimum', 'Pago mínimo en CLP', latest?.minimum, { required: true })}</div>
    <div class="field-grid">${numericInput('interest', 'Intereses incluidos en CLP', latest?.interest ?? 0, { required: true })}
      ${numericInput('fees', 'Comisiones incluidas en CLP', latest?.fees ?? 0, { required: true })}</div>
    ${formFooter('Guardar estado de cuenta')}</form>`);
}

function openAssetWriteDown(id) {
  const asset = state.accounts.find(account => account.id === id && account.kind === 'asset' && account.profile !== 'cash');
  if (!asset) return;
  openMovement();
  const form = dialog.querySelector('form');
  form.elements.type.value = 'expense';
  movementOptions(form, { from: asset.id });
  form.elements.description.value = 'Depreciación o pérdida de valor de ' + asset.name;
  const note = document.createElement('p');
  note.className = 'field-note';
  note.textContent = 'Elige una categoría de gasto y registra solo la pérdida efectivamente reconocida. Este asiento reduce el activo; una valoración estimada no lo modifica.';
  form.querySelector('[data-project-field]').before(note);
}

function showMovement(id) {
  const entry = state.entries.find(item => item.id === id);
  if (!entry) return;
  const accounts = accountIndex(state);
  const reversal = state.entries.find(item => item.reverses === id);
  modal(esc(entry.description), `
    <div class="detail-amount numeric">${movementAmount(entry)}</div>
    <p class="detail-subtitle">${dateName(entry.date)} · ${entry.status === 'draft' ? 'Borrador' : 'Contabilizado'}</p>
    ${entry.goal ? `<p class="detail-subtitle">Presupuesto: ${esc(state.goals.find(goal => goal.id === entry.goal)?.name ?? 'Sin presupuesto')}</p>` : ''}
    <table class="entry-table"><thead><tr><th>Cuenta</th><th>Debe</th><th>Haber</th></tr></thead>
      <tbody>${entry.lines.map(line => `<tr><th>${esc(accounts.get(line.account).name)}</th>
        <td>${line.debit ? money(line.debit) : '—'}</td><td>${line.credit ? money(line.credit) : '—'}</td></tr>`).join('')}</tbody></table>
    ${entry.status === 'draft' ? '<p class="dialog-description">El borrador se incorpora a los informes al contabilizarlo.</p>' : ''}
    ${reversal ? `<p class="dialog-description">Revertido el ${dateName(reversal.date)}.
      ${button('movement-detail', 'Ver reversión', { style: 'secondary small', attributes: `data-id="${esc(reversal.id)}"` })}</p>` : ''}
    ${entry.reverses ? `<p>${button('movement-detail', 'Ver movimiento original', { style: 'secondary small', attributes: `data-id="${esc(entry.reverses)}"` })}</p>` : ''}
    <div class="dialog-actions">
      ${entry.status === 'draft'
        ? button('draft-edit', 'Editar borrador', { style: 'primary', attributes: `data-id="${esc(id)}"` })
          + button('draft-delete', 'Eliminar borrador', { style: 'secondary', attributes: `data-id="${esc(id)}"` })
        : entry.type !== 'reversal' && !reversal
          ? button('reverse-form', 'Revertir movimiento', { style: 'secondary', attributes: `data-id="${esc(id)}"` }) : ''}
    </div>`, { drawer: true, caption: MOVEMENTS[entry.type] });
}

function openReverse(id) {
  const original = state.entries.find(entry => entry.id === id);
  if (!original) return;
  const date = entryDate() < original.date ? original.date : entryDate();
  modal('Revertir movimiento', `<form data-form="reversal" data-id="${esc(id)}">
    <p class="dialog-description">Fino creará un asiento inverso a «${esc(original.description)}» por ${movementAmount(original)}. Ambos quedarán en el libro.</p>
    ${input('date', 'Fecha de la reversión', { type: 'date', value: date, attributes: `required min="${original.date}" max="${today}"` })}
    ${formFooter('Crear reversión')}</form>`);
}

function accountFields(form, selected) {
  const kind = form.elements.kind.value;
  const profile = form.elements.profile;
  const profiles = PROFILES[kind] ?? {};
  const previous = selected ?? profile.value;
  profile.innerHTML = Object.entries(profiles).map(([key, name]) =>
    option(key, name, Object.hasOwn(profiles, previous) ? previous : kind === 'asset' ? 'cash' : 'unclassified')).join('');
  profile.closest('label').hidden = !PROFILES[kind];
  updateProfileFields(form);
}

function updateProfileFields(form) {
  const { kind, profile } = form.elements;
  const visibility = {
    opening: Boolean(PROFILES[kind.value]),
    valuation: kind.value === 'asset' && profile.value !== 'cash',
    liability: kind.value === 'liability' && profile.value !== 'unclassified',
    credit: kind.value === 'liability' && ['card', 'line'].includes(profile.value),
  };
  for (const [key, visible] of Object.entries(visibility)) {
    const fields = form.querySelector('[data-account-fields="' + key + '"]');
    if (fields) fields.hidden = !visible;
  }
}

function openAccount(id) {
  const account = id && state.accounts.find(item => item.id === id);
  if (id && (!account || id === OPENING_EQUITY)) return;
  const locked = account && !canDeleteAccount(state, id);
  modal(account ? 'Editar cuenta' : 'Nueva cuenta', `<form data-form="account" data-id="${esc(id)}">
    ${input('name', 'Nombre', { value: account?.name, attributes: 'required maxlength="70" placeholder="Ej. Cuenta corriente"' })}
    <div class="field-grid">
      ${select('kind', 'Clase contable', Object.entries(CLASSES).map(([key, name]) => option(key, name, account?.kind)).join(''), locked ? 'disabled' : '')}
      ${select('profile', 'Clasificación', '')}
    </div>
    ${account ? '' : `<div class="field-grid" data-account-fields="opening">
      ${numericInput('opening', 'Saldo inicial en CLP (opcional)')}
      ${input('openingDate', 'Fecha de apertura', { type: 'date', value: entryDate(), attributes: `max="${today}"` })}</div>`}
    <div data-account-fields="valuation"><div class="field-grid">
      ${numericInput('estimate', 'Valor estimado en CLP', account?.estimate)}
      ${input('valuationDate', 'Fecha de valoración', { type: 'date', value: account?.valuationDate ?? entryDate(), attributes: `max="${today}"` })}</div>
      <small class="field-note">La valoración se muestra por separado del saldo contable.</small></div>
    <div data-account-fields="liability" class="field-grid">
      ${input('institution', 'Institución', { value: account?.institution, attributes: 'maxlength="70"' })}
      ${numericInput('dueDay', 'Día de vencimiento', account?.dueDay, { min: 1, max: 31 })}
      ${numericInput('monthlyPayment', 'Cuota mensual pactada (opcional)', account?.monthlyPayment, { min: 1 })}
      ${numericInput('monthlyFee', 'Comisión mensual estimada (opcional)', account?.monthlyFee, { min: 0 })}
      ${input('annualRate', 'Interés anual informado (%)', { type: 'number', value: account?.annualRateBps === undefined ? '' : account.annualRateBps / 100,
        attributes: 'min="0" max="100" step="0.01" inputmode="decimal"' })}
    </div>
    <div data-account-fields="credit" class="field-grid">
      ${select('paymentAccount', 'Pagar desde', option('', 'Sin cuenta vinculada', account?.paymentAccount)
        + state.accounts.filter(item => item.kind === 'asset' && item.profile === 'cash')
          .map(item => option(item.id, item.name, account?.paymentAccount)).join(''))}
      ${numericInput('limit', 'Límite de crédito en CLP', account?.limit, { min: 1 })}
      ${numericInput('closingDay', 'Día de cierre', account?.closingDay, { min: 1, max: 31 })}
      ${numericInput('minimum', 'Pago mínimo en CLP', account?.minimum, { min: 1 })}
    </div>
    ${formFooter(account ? 'Guardar cuenta' : 'Crear cuenta')}
  </form>`);
  accountFields(dialog.querySelector('form'), account?.profile);
}

function showAccount(id) {
  const account = state.accounts.find(item => item.id === id);
  if (!account) return;
  const { period } = context();
  const balance = positionFor(state, period.end).balances.get(id);
  const metadata = [];
  if (account.kind === 'asset') {
    const reserved = reservedIn(state, id);
    if (reserved) metadata.push(['Reservado para proyectos', money(reserved)],
      ['Saldo sin asignar', money(balance - reserved)]);
  }
  if (account.profile) metadata.push(['Clasificación', PROFILES[account.kind][account.profile]]);
  if (account.estimate !== undefined) {
    metadata.push(['Valoración manual', account.valuationDate <= period.end
      ? money(account.estimate) + ' · ' + dateName(account.valuationDate) : 'Sin valoración al corte']);
    if (account.valuationDate <= period.end) metadata.push(['Diferencia vs. saldo contable', signed(account.estimate - balance)]);
  }
  if (account.institution) metadata.push(['Institución', account.institution]);
  if (account.limit) {
    metadata.push(['Límite de crédito', money(account.limit)], ['Crédito disponible', money(Math.max(0, account.limit - balance))],
      ['Utilización', percent(Math.max(0, balance) / account.limit)]);
  }
  if (account.dueDay) metadata.push(['Próximo vencimiento al corte', dateName(nextPayment(account.dueDay, period.end))]);
  if (account.closingDay) metadata.push(['Día de cierre', String(account.closingDay)]);
  if (account.minimum) metadata.push(['Pago mínimo', money(account.minimum)]);
  if (account.paymentAccount) metadata.push(['Pagar desde', state.accounts.find(item => item.id === account.paymentAccount)?.name ?? 'Cuenta no disponible']);
  if (account.monthlyPayment) metadata.push(['Cuota mensual informada', money(account.monthlyPayment)]);
  if (account.monthlyFee !== undefined) metadata.push(['Comisión mensual informada (no contabilizada)', money(account.monthlyFee)]);
  if (account.annualRateBps !== undefined) metadata.push(['Tasa anual informada', percent(account.annualRateBps / 10000)]);
  const statement = ['card', 'line'].includes(account.profile) ? cardStatement(state, id, period.end) : null;
  if (statement) metadata.push(['Último total facturado', money(statement.billed)],
    ['Vencimiento real', dateName(statement.dueDate)], ['Pago mínimo facturado', money(statement.minimum)],
    ['Intereses incluidos en el estado', money(statement.interest)], ['Comisiones incluidas en el estado', money(statement.fees)],
    ['Pagos registrados desde emisión', money(statementPayments(state, statement, period.end))],
    ['Pendiente estimado de ese estado', money(Math.max(0, statement.billed - statementPayments(state, statement, period.end)))]);
  const attrs = `data-id="${esc(id)}"`;
  modal(esc(account.name), `<div class="detail-amount numeric">${money(balance)}</div>
    <p class="detail-subtitle">Saldo contable al ${dateName(period.end)} · ${account.active ? 'Activa' : 'Desactivada'}</p>
    <dl class="detail-list">${metadata.map(([label, value]) => `<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>
    ${statement ? '<p class="field-note">Los pagos registrados se asignan por fecha hasta la siguiente emisión; verifica el pendiente en el banco. Intereses y comisiones del estado son informativos y deben contabilizarse por separado.</p>' : ''}
    <p>${drill(id, 'Ver movimientos de la cuenta ' + icon('arrow', 15), 'asof')}</p>
    ${['card', 'line'].includes(account.profile) ? `<p>${button('statement-edit', statement ? 'Actualizar estado de cuenta' : 'Registrar estado de cuenta',
      { style: 'secondary', attributes: attrs })}</p>` : ''}
    ${account.active && account.paymentAccount && balance > 0 ? `<p>${button('card-pay', 'Registrar pago desde cuenta vinculada', { style: 'secondary', attributes: attrs })}</p>` : ''}
    ${account.kind === 'asset' && account.profile !== 'cash' && balance > 0
      ? `<p>${button('asset-write-down', 'Registrar depreciación o pérdida', { style: 'secondary', attributes: attrs })}</p>` : ''}
    ${id === OPENING_EQUITY ? '<p class="dialog-description">Esta cuenta compensa los asientos de apertura.</p>'
      : `<div class="dialog-actions">
          ${button('account-edit', 'Editar cuenta', { style: 'primary', attributes: attrs })}
          ${button('account-status', account.active ? 'Desactivar' : 'Activar', { style: 'secondary', attributes: attrs })}
          ${canDeleteAccount(state, id) ? button('account-delete', 'Eliminar', { style: 'secondary', attributes: attrs }) : ''}
        </div>`}`, { drawer: true, caption: CLASSES[account.kind] });
}

function openBudget(id) {
  const categories = state.accounts.filter(account => ['expense', 'income'].includes(account.kind)
    && (account.active || account.id === id));
  if (!categories.length) {
    modal('Definir presupuesto', empty('Crea una categoría primero', 'Los presupuestos se vinculan a una cuenta de ingresos o gastos.',
      button('account-new', 'Crear cuenta', { style: 'primary', glyph: 'plus' })));
    return;
  }
  const plan = state.budgets.find(item => item.month === month && item.account === id);
  modal('Definir presupuesto', `<form data-form="budget">
    <p class="dialog-description capitalize">${monthName(month)}</p>
    ${select('account', 'Categoría', activeOptions(categories, id, 'Selecciona una categoría'), plan ? 'disabled' : 'required')}
    ${numericInput('planned', 'Monto planificado en CLP', plan?.planned, { required: true })}
    ${formFooter('Guardar presupuesto')}</form>`);
}

function openGoal(id) {
  const goal = id && state.goals.find(item => item.id === id);
  modal(goal ? 'Editar presupuesto' : 'Nuevo presupuesto', `<form data-form="goal" data-id="${esc(id)}">
    ${input('name', 'Nombre', { value: goal?.name, attributes: 'required maxlength="70" placeholder="Ej. Viaje de Erich"' })}
    ${numericInput('target', 'Límite máximo en CLP', goal?.target, { min: 1, required: true })}
    <p class="field-note">Este límite sirve para seguir gastos; no mueve dinero entre cuentas.</p>
    ${formFooter('Guardar presupuesto')}</form>`);
}

function showGoal(id) {
  const goal = state.goals.find(item => item.id === id);
  if (!goal) return;
  const accounts = accountIndex(state);
  const amount = goal.allocations.reduce((sum, item) => sum + item.amount, 0);
  const spent = goalSpending(state, id, today);
  const linked = sortedMovements(state.entries.filter(entry => entry.goal === id && entry.status === 'posted'));
  const categories = new Map();
  for (const entry of linked) {
    const original = entry.type === 'reversal' ? state.entries.find(item => item.id === entry.reverses) : entry;
    const category = original?.lines.find(line => accounts.get(line.account)?.kind === 'expense')?.account;
    if (category) categories.set(category, (categories.get(category) ?? 0)
      + (entry.type === 'reversal' ? -1 : 1) * entry.lines.reduce((sum, line) => sum + line.debit, 0));
  }
  modal(esc(goal.name), `<div class="detail-amount numeric">${signed(goal.target - spent)}</div>
    <p class="detail-subtitle">Disponible del límite · ${money(goal.target)} máximo · ${money(spent)} rendido</p>
    ${amount ? `<p class="field-note">Reserva bancaria opcional: ${money(amount)}. Esta reserva no altera el límite.</p>
      <dl class="detail-list">${goal.allocations.map(item => `<div><dt>${esc(accounts.get(item.account).name)}</dt><dd>${money(goalReservation(state, goal, item.account, today))} reservado</dd></div>`).join('')}</dl>` : ''}
    ${[...categories].filter(([, value]) => value > 0).sort((a, b) => b[1] - a[1]).length ? `<h3>¿En qué se gastó?</h3>
      ${[...categories].filter(([, value]) => value > 0).sort((a, b) => b[1] - a[1]).map(([category, value]) => `<div class="project-category">
        <span>${esc(accounts.get(category)?.name ?? 'Categoría')}</span><strong>${money(value)}</strong>
        <div class="project-track"><i style="width:${spent > 0 ? Math.min(100, value / spent * 100) : 0}%"></i></div></div>`).join('')}` : ''}
    <h3>Gastos vinculados</h3>${movementRows(linked, accounts)}
    <p class="dialog-description">Puedes reservar además parte de una cuenta, sin crear una subcuenta ni cambiar el presupuesto.</p>
    <div class="dialog-actions">${button('goal-edit', 'Editar límite', { style: 'secondary', attributes: `data-id="${esc(id)}"` })}
      ${button('allocation-form', 'Reserva opcional', { style: 'secondary', attributes: `data-id="${esc(id)}"` })}</div>`,
    { drawer: true, caption: 'Presupuesto' });
}

function allocationInfo(form) {
  const goal = state.goals.find(item => item.id === form.dataset.id);
  const account = form.elements.account.value;
  const amount = goal.allocations.find(item => item.account === account)?.amount;
  form.elements.amount.value = amount ?? '';
  const available = (positionFor(state, today).balances.get(account) ?? 0) - reservedIn(state, account, goal.id);
  form.querySelector('[data-allocation-info]').textContent = account
    ? 'Disponible para este objetivo ' + money(Math.max(0, available)) + '. Ingresa 0 para liberar la asignación.'
    : 'Selecciona la cuenta que financiará el objetivo.';
}

function openAllocation(id) {
  const goal = state.goals.find(item => item.id === id);
  if (!goal) return;
  const eligible = state.accounts.filter(account => account.kind === 'asset'
    && (account.active || goal.allocations.some(item => item.account === account.id)));
  if (!eligible.length) {
    modal('Administrar asignaciones', empty('Sin cuentas de activo disponibles', 'Crea una cuenta de activo para reservar parte de su saldo.'));
    return;
  }
  modal('Administrar asignaciones', `<form data-form="allocation" data-id="${esc(id)}">
    ${select('account', 'Cuenta de activo', activeOptions(eligible, goal.allocations[0]?.account), 'required')}
    ${numericInput('amount', 'Monto reservado en CLP', '', { required: true })}
    <p class="field-note" data-allocation-info></p>${formFooter('Guardar asignación')}</form>`);
  allocationInfo(dialog.querySelector('form'));
}

function showSettings() {
  const storage = usesTemporaryStorage()
    ? 'Tus datos se guardan localmente en este navegador. Si cambias de archivo, navegador o computador, importa un respaldo JSON.'
    : location.protocol === 'https:'
      ? 'Cada cambio se guarda en tu base de datos privada en Cloudflare. Descarga respaldos JSON periódicos.'
      : location.hostname === '127.0.0.1'
      ? 'Cada cambio se guarda automáticamente en Documents/Fino/fino-data.json. Al abrir Fino desde el lanzador se recupera ese archivo.'
      : 'Tus registros se guardan en este navegador. Para guardarlos en un archivo fijo, abre Fino desde el lanzador local.';
  modal('Configuración', `<div class="settings-section">
    <h3>Espacio de trabajo</h3>
    <p>${storage}</p>
    ${button(space === 'demo' ? 'personal' : 'demo', space === 'demo' ? 'Abrir mis finanzas' : 'Ver demo', { style: 'primary' })}
    </div><div class="settings-section"><h3>Respaldos</h3>
    <p>Descarga tus cuentas, movimientos, presupuestos y objetivos en un archivo JSON. Puedes importarlo si cambias de navegador o de computador.</p>
    <div class="dialog-actions">
      ${button('export', 'Descargar respaldo', { style: 'secondary' })}
      ${button('import-select', 'Importar respaldo', { style: 'secondary' })}
    </div><input type="file" id="backup-file" accept=".json,application/json" hidden></div>`);
}

let importedState;
async function readBackup(file) {
  try {
    if (!file || file.size > 15_000_000) throw new Error('El archivo supera el tamaño admitido.');
    importedState = validateBackup(JSON.parse(await file.text()));
    confirmAction('Importar respaldo', 'El respaldo reemplazará los registros del espacio abierto. Puedes descargar una copia de ese espacio desde Configuración.',
      'import-confirm', 'Reemplazar registros', '', true);
  } catch (error) {
    showError(error instanceof SyntaxError ? new Error('Selecciona un archivo JSON de Fino válido.') : error);
  }
}

function downloadBackup() {
  const blob = new Blob([JSON.stringify({ format: 'fino-web', version: 1, state }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'fino-' + space + '-' + today + '.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify('Respaldo descargado');
}

async function switchSpace(to) {
  if (space === to || busy) return;  busy = true;
  try {
    const loaded = await accessSpace(to);
    state = loaded.state;
    space = to;
    setPreference('fino-space', space);
    month = to === 'personal' ? thisMonth : DEMO_MONTH;
    essentialScenario = null;
    newPaymentScenario = 0;
    loanRateScenario = 18; loanMonthsScenario = 24;
    historyFocus = flowFocus = trendEnd = undefined;
    filters = defaultFilters();
    report = 'overview';
    dialog.close();
    navigate('reports');
    notify(to === 'personal' ? 'Espacio personal abierto' : 'Demostración abierta');
  } catch (error) {
    showError(error);
  } finally {
    busy = false;
  }
}

async function commit(mutation, message, after) {
  if (busy) return;
  busy = true;
  try {
    const { state: next, outcome } = await accessSpace(space, mutation);
    state = next;
    dialog.close();
    render();
    notify(message);
    if (after) after(outcome);
  } catch (error) {
    showError(error);
  } finally {
    busy = false;
  }
}

function changeMonth(next, fromTrend = false) {
  if (!isDate(next + '-01') || next > thisMonth) return false;
  trendEnd = fromTrend ? trendEnd ?? month : undefined;
  month = next;
  historyFocus = flowFocus = undefined;
  render();
  return true;
}

function focusChartControl(action, property, value) {
  const controls = content.querySelectorAll('[data-action="' + action + '"]');
  Array.from(controls).find(control => control.dataset[property] === value && control.hasAttribute('aria-pressed'))
    ?.focus({ preventScroll: true });
}

const actions = {
  home: () => { report = 'overview'; navigate('reports'); },
  page: element => navigate(element.dataset.page),
  report: element => selectReport(element.dataset.report),
  'history-range': element => {
    historyLength = Number(element.dataset.length);
    historyFocus = undefined;
    render();
    focusChartControl('history-range', 'length', element.dataset.length);
  },
  'history-point': element => {
    historyFocus = element.dataset.month;
    render();
    focusChartControl('history-point', 'month', historyFocus);
  },
  'chart-balance': element => {
    if (element.dataset.month !== month) changeMonth(element.dataset.month);
    selectReport('balance');
  },
  'chart-month': element => {
    if (changeMonth(element.dataset.month, true)) focusChartControl('chart-month', 'month', month);
  },
  'flow-select': (_, id) => {
    flowFocus = flowFocus === id ? undefined : id;
    render();
    focusChartControl('flow-select', 'id', id);
  },
  previous: () => changeMonth(shiftMonth(month, -1)),
  next: () => changeMonth(shiftMonth(month, 1)),
  period: () => modal('Elegir período', `<form data-form="period">
    ${input('month', 'Mes', { type: 'month', value: month, attributes: `required max="${thisMonth}" placeholder="AAAA-MM"` })}
    ${formFooter('Aplicar')}</form>`),
  calendar: element => {
    const field = element.previousElementSibling;
    if (typeof field?.showPicker === 'function') {
      try { field.showPicker(); return; } catch { /* Some browsers only allow focus. */ }
    }
    field?.focus();
    field?.click();
  },
  'movement-new': () => openMovement(),
  'reconcile-open': () => openReconciliation(),
  'cash-plan-new': openCashPlan,
  'cash-plan-delete': (_, id) => commit(current => { current.cashPlans = (current.cashPlans ?? []).filter(item => item.id !== id); }, 'Proyección actualizada'),
  'movement-detail': (_, id) => showMovement(id),
  'draft-edit': (_, id) => openMovement(id),
  'draft-delete': (_, id) => confirmAction('Eliminar borrador', 'Se quitará este borrador de Movimientos.',
    'draft-delete-confirm', 'Eliminar borrador', id, true),
  'draft-delete-confirm': (_, id) => commit(current => deleteDraft(current, id), 'Borrador eliminado'),
  'reverse-form': (_, id) => openReverse(id),
  'account-new': () => openAccount(),
  'account-edit': (_, id) => openAccount(id),
  'account-detail': (_, id) => showAccount(id),
  'card-pay': (_, id) => openCardPayment(id),
  'statement-edit': (_, id) => openStatement(id),
  'asset-write-down': (_, id) => openAssetWriteDown(id),
  'account-status': (_, id) => {
    const account = state.accounts.find(item => item.id === id);
    if (account) commit(current => changeAccountStatus(current, id, !account.active), account.active ? 'Cuenta desactivada' : 'Cuenta activada', () => showAccount(id));
  },
  'account-delete': (_, id) => confirmAction('Eliminar cuenta', 'Se eliminará la cuenta vacía del plan de cuentas.',
    'account-delete-confirm', 'Eliminar cuenta', id, true),
  'account-delete-confirm': (_, id) => commit(current => deleteAccount(current, id), 'Cuenta eliminada'),
  'budget-new': () => openBudget(),
  'budget-edit': (_, id) => openBudget(id),
  'goal-new': () => openGoal(),
  'goal-edit': (_, id) => openGoal(id),
  'goal-detail': (_, id) => showGoal(id),
  'allocation-form': (_, id) => openAllocation(id),
  drill: element => {
    dialog.close();
    page = 'movements';
    filters = { ...defaultFilters(), account: element.dataset.account, range: element.dataset.range, posted: true };
    history.replaceState(null, '', '#movements');
    render();
    content.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  },
  'clear-filter': () => { filters = defaultFilters(); render(); },
  settings: showSettings,
  close: () => dialog.close(),
  personal: () => switchSpace('personal'),
  demo: () => switchSpace('demo'),
  export: downloadBackup,
  'import-select': () => dialog.querySelector('#backup-file').click(),
  'import-confirm': () => {
    const imported = importedState;
    if (imported) commit(current => Object.assign(current, imported), 'Respaldo importado');
    importedState = undefined;
  },
};

document.addEventListener('click', event => {
  const element = event.target.closest('[data-action]');
  if (!state || !element || element.disabled) return;
  if (element instanceof HTMLAnchorElement) event.preventDefault();
  actions[element.dataset.action]?.(element, element.dataset.id);
});

document.addEventListener('keydown', event => {
  const point = event.target.closest?.('[data-action="history-point"], [data-action="chart-month"]');
  if (point?.namespaceURI === 'http://www.w3.org/2000/svg' && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    actions[point.dataset.action](point);
  }
});

document.addEventListener('input', event => {
  if (event.target.closest?.('[data-form="reconciliation"]') && event.target.name === 'balance') updateReconciliationDifference(event.target.form);
  if (event.target.id === 'movement-search') {
    filters.search = event.target.value;
    refreshMovements();
  }
});

document.addEventListener('change', event => {
  const target = event.target;
  if (target.form?.dataset.form === 'reconciliation' && ['account', 'date'].includes(target.name)) {
    openReconciliation(target.form.elements.account.value, target.form.elements.date.value);
  } else if (target.form?.dataset.form === 'reconciliation' && target.name === 'entry') {
    updateReconciliationDifference(target.form);
  } else if (target.dataset.period === 'month') {
    if (!changeMonth(target.value)) target.value = month;
  } else if (target.dataset.scenario) {
    const amount = target.value === '' ? null : Number(target.value);
    if (amount !== null && !(target.dataset.scenario === 'loan-rate' ? Number.isFinite(amount) && amount >= 0 && amount <= 100 : integer(amount, 0, target.dataset.scenario === 'loan-months' ? 360 : MAX_AMOUNT))) {
      showError(new Error('Ingresa un monto entero no negativo para el escenario.'));
      return;
    }
    if (target.dataset.scenario === 'essential') essentialScenario = amount;
    if (target.dataset.scenario === 'new-payment') newPaymentScenario = amount ?? 0;
    if (target.dataset.scenario === 'loan-rate') loanRateScenario = Math.min(100, amount ?? 0);
    if (target.dataset.scenario === 'loan-months') loanMonthsScenario = Math.max(1, Math.min(360, amount ?? 1));
    render();
  } else if (target.dataset.filter) {
    filters[target.dataset.filter] = target.value;
    refreshMovements();
  } else if (target.id === 'backup-file' && target.files[0]) {
    readBackup(target.files[0]);
  } else if (target.form?.dataset.form === 'movement' && target.name === 'type') {
    movementOptions(target.form);
  } else if (target.form?.dataset.form === 'account' && target.name === 'kind') {
    accountFields(target.form);
  } else if (target.form?.dataset.form === 'account' && target.name === 'profile') {
    updateProfileFields(target.form);
  } else if (target.form?.dataset.form === 'budget' && target.name === 'account') {
    const plan = state.budgets.find(item => item.month === month && item.account === target.value);
    target.form.elements.planned.value = plan?.planned ?? '';
  } else if (target.form?.dataset.form === 'allocation' && target.name === 'account') {
    allocationInfo(target.form);
  }
});

document.addEventListener('submit', event => {
  const form = event.target;
  if (!form.dataset.form) return;
  event.preventDefault();
  const get = name => form.elements[name]?.value;
  const num = name => form.elements[name]?.valueAsNumber;
  const id = form.dataset.id || undefined;
  switch (form.dataset.form) {
    case 'reconciliation': {
      const entries = [...form.querySelectorAll('[name="entry"]:checked')].map(input => input.value);
      commit(current => saveReconciliation(current, get('account'), get('date'), num('balance'), entries), 'Extracto conciliado');
      break;
    }
    case 'cash-plan': {
      commit(current => saveCashPlan(current, { label: get('label').trim(), date: get('date'), direction: get('direction'), amount: num('amount') }), 'Proyección actualizada');
      break;
    }
    case 'movement': {
      const status = event.submitter?.name === 'draft' ? 'draft' : 'posted';
      const input = { type: get('type'), description: get('description'), from: get('from'),
        to: get('to'), amount: num('amount'), date: get('date'), cashClass: get('cashClass'),
        goal: get('type') === 'expense' ? get('goal') : '' };
      commit(current => recordMovement(current, input, status, id), status === 'draft' ? 'Borrador guardado' : 'Movimiento contabilizado', entry => {
        if (status !== 'posted' || entry.type !== 'expense') return;
        const account = state.accounts.find(item => item.id === input.from);
        if (!account?.limit || !['card', 'line'].includes(account.profile)) return;
        const balance = positionFor(state, today).balances.get(account.id) ?? 0;
        if (balance >= account.limit * .8) notify(`${account.name}: ${percent(balance / account.limit)} del cupo utilizado.`);
      });
      break;
    }
    case 'reversal': {
      const date = get('date');
      commit(current => reverseMovement(current, id, date), 'Reversión contabilizada', entry => showMovement(entry.id));
      break;
    }
    case 'account': {
      const optional = name => form.elements[name] ? nullableNumber(form, name) : null;
      const input = { name: get('name'), kind: get('kind'), profile: get('profile') ?? '',
        opening: PROFILES[get('kind')] ? optional('opening') ?? 0 : 0, openingDate: get('openingDate'),
        estimate: optional('estimate'), valuationDate: get('valuationDate'), institution: get('institution'),
        limit: optional('limit'), dueDay: optional('dueDay'), closingDay: optional('closingDay'), minimum: optional('minimum'),
        monthlyPayment: optional('monthlyPayment'), monthlyFee: optional('monthlyFee'),
        annualRateBps: get('annualRate') === '' ? null : Math.round(num('annualRate') * 100), paymentAccount: get('paymentAccount') };
      if (!['card', 'line'].includes(input.profile)) input.limit = input.minimum = input.closingDay = null;
      commit(current => upsertAccount(current, input, id), id ? 'Cuenta actualizada' : 'Cuenta creada', account => showAccount(account.id));
      break;
    }
    case 'statement': {
      const input = { account: id, issueDate: get('issueDate'), dueDate: get('dueDate'),
        billed: num('billed'), minimum: num('minimum'), interest: num('interest'), fees: num('fees') };
      commit(current => upsertStatement(current, input), 'Estado de cuenta guardado', () => showAccount(id));
      break;
    }
    case 'budget': {
      const account = get('account'), planned = num('planned'), selected = month;
      commit(current => upsertBudget(current, selected, account, planned), 'Presupuesto guardado');
      break;
    }
    case 'goal': {
      const name = get('name'), target = num('target');
      commit(current => upsertGoal(current, name, target, id), 'Presupuesto guardado', goal => showGoal(goal.id));
      break;
    }
    case 'allocation': {
      const account = get('account'), amount = num('amount');
      commit(current => setAllocation(current, id, account, amount, today), 'Asignación guardada', () => showGoal(id));
      break;
    }
    case 'period': {
      const next = get('month');
      if (!isDate(next + '-01') || next > thisMonth) {
        showError(new Error('Ingresa un mes válido en formato AAAA-MM.'));
      } else {
        dialog.close();
        changeMonth(next);
      }
      break;
    }
  }
});

onSpaceChange(async updated => {
  if (updated !== space) return;
  try {
    const loaded = await accessSpace(updated);
    if (space === updated) {
      state = loaded.state;
      render();
    }
  } catch (error) { showError(error); }
});

try {
  state = (await accessSpace(space)).state;
  render();
} catch (error) {
  content.innerHTML = empty('Fino no pudo abrir los registros', 'Revisa si el navegador permite almacenamiento local y recarga la página.');
  console.error(error);
}

</script>
</head>
<body>
  <a class="skip" href="#content">Ir al contenido</a>
  <div class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="Menú principal"></aside>
    <div class="main-shell">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="content" tabindex="-1">
        <p class="loading" role="status">Abriendo Fino…</p>
      </main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="loading">Activa JavaScript para usar Fino en tu navegador.</p></noscript>
</body>
</html>
